<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八年級國文 第二次段考強化練習</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e3ded3;
  --ok:#1f8a4c; --okbg:#e3f5ea; --bad:#c43c2f; --badbg:#fbe6e3;
  --accent:#8b3a3a; --soft:#f6e6e3; --gold:#e3a500;
  --zh:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","MingLiU","Songti TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:19px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hidden{display:none!important}

/* ---------- 首頁 ---------- */
.hero{background:linear-gradient(135deg,#5a2a27,#8b4a3c);color:#fff;border-radius:22px;padding:28px 26px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;font-size:30px;letter-spacing:1px}
.hero .sub{opacity:.9;font-size:17px}
.hero .deco{position:absolute;right:6px;bottom:-30px;font-size:130px;opacity:.13;font-family:var(--serif);font-weight:800}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 14px;font-size:16px}
.stat b{font-size:22px;margin-right:4px}
.rank{display:inline-block;background:var(--gold);color:#3a2a00;border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.lcard{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:20px;text-align:left;position:relative;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px;color:inherit}
.lcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.lcard .top{display:flex;align-items:center;gap:12px}
.lcard .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none}
.lcard .ttl{font-weight:800;font-size:22px}
.lcard .en{color:var(--muted);font-size:16px}
.lcard .pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:14px;border-radius:999px;padding:2px 10px;background:#f1eee7;color:#4a4f57}
.bar{height:10px;background:#eee8dc;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.lcard .meta{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:2px}
.howto{margin-top:22px;background:var(--card);border-radius:16px;border:1px dashed #cfc6b3;padding:14px 18px;font-size:16px;color:#4a4f57}
.howto b{color:var(--ink)}

/* ---------- 課次頁 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-size:16px}
.banner{border-radius:20px;padding:22px 24px;color:#fff;position:relative;overflow:hidden}
.banner h2{margin:0;font-size:26px}
.banner .en{font-size:18px;opacity:.95}
.banner .pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.banner .chip{background:rgba(255,255,255,.2);color:#fff}
.banner .big{position:absolute;right:16px;top:8px;font-size:72px;opacity:.25}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.ucard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;gap:14px;align-items:flex-start;color:inherit;transition:border-color .15s,transform .15s;position:relative}
.ucard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ucard .no{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.ucard .t{font-weight:800;font-size:19px}
.ucard .d{font-size:15px;color:var(--muted);line-height:1.45}
.ucard .s{margin-top:6px;font-size:15px;color:var(--muted)}
.ucard.locked{opacity:.7}
.ucard.exam{border-color:#e6c873;background:#fffbea}
.lock{position:absolute;top:10px;right:12px;font-size:13px;background:#efe9dc;border-radius:999px;padding:1px 10px;color:#6b5d3c}
.stars{color:var(--gold);letter-spacing:2px;font-size:18px}
.stars .off{color:#d9d2c3}

/* ---------- 作答頁 ---------- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .name{font-weight:800;font-size:18px;flex:1;min-width:150px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;white-space:nowrap}
.combo{background:#fff1e0;border-color:#ffc98a;color:#a04d00}
.prog{height:12px;background:#e6e0d3;border-radius:99px;overflow:hidden;margin:12px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.psg{background:#fffdf7;border:2px solid #e8dfc8;border-radius:16px;padding:14px 18px;margin-bottom:14px}
.psg .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.psg .ph b{font-size:18px}
.psg .tog{background:none;border:1px solid #d8cdb2;border-radius:999px;padding:2px 12px;font-size:14px;color:#6b5d3c;white-space:nowrap}
.psg .body{max-height:48vh;overflow:auto;margin-top:8px;padding-right:4px;font-family:var(--serif);font-size:19px;line-height:1.9}
.psg p{margin:0 0 10px;text-indent:2em}
.psg p.ni{text-indent:0}
.psg .src{text-align:right;color:#6b5d3c;font-size:15px;font-family:var(--zh)}
.psg .notes{font-family:var(--zh);font-size:15px;color:#6b5d3c;border-top:1px dashed #e0d5ba;padding-top:8px;margin-top:4px;line-height:1.6}
.qcard{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:20px 22px}
.tag{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;border-radius:8px;padding:2px 10px;margin-bottom:10px}
.stem{font-size:21px;line-height:1.75}
.stem .qt{font-family:var(--serif)}
.phrase{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:4px;text-align:center;margin:6px 0 4px;line-height:1.5}
.phrase .hl,.stem .hl{color:var(--accent);border-bottom:3px solid var(--accent);padding:0 2px}
.ask{text-align:center;color:var(--muted);font-size:17px}
.hint2{margin-top:6px;font-size:16px;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.zy{grid-template-columns:repeat(4,1fr)}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fbfaf7;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:19px;color:inherit}
.opts.zy .opt,.opts.two .opt{flex-direction:column;align-items:center;gap:6px;text-align:center}
.opts.zy .opt .v{font-size:30px;font-family:var(--serif);font-weight:700;line-height:1.3}
.opts.zy .opt .v.bpmf{font-family:var(--zh);font-size:25px;letter-spacing:1px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;background:#eee9df;display:grid;place-items:center;font-weight:800;font-size:16px}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.sent{font-family:var(--serif);font-size:28px;line-height:2.1;margin-top:28px;text-align:center}
.ch{font:inherit;background:#fffef9;border:2px solid #e2dccd;border-radius:8px;padding:0 3px;margin:2px 1px;color:inherit;min-width:40px;position:relative}
.ch:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.ch.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.ch.right{background:var(--okbg);border-color:var(--ok)}
.ch.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ch:disabled{cursor:default}
.ch .fix{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:17px;background:var(--ok);color:#fff;border-radius:6px;padding:0 6px;line-height:1.5;white-space:nowrap}
.pu{color:#8b8577}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:none;border-radius:12px;padding:10px 22px;font-weight:700;font-size:18px;background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;font-size:17px}
.fb.ok{background:var(--okbg);border:2px solid #9fd7b5}
.fb.no{background:var(--badbg);border:2px solid #efb3aa}
.fb .h{font-weight:800;font-size:19px}
.fb .ca{font-weight:700;margin-top:4px}
.fb .ex{margin-top:6px;color:#3d434a}
.xp-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:var(--ok);pointer-events:none;animation:pop .9s ease forwards;text-shadow:0 2px 0 #fff;z-index:20}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

/* ---------- 結果頁 ---------- */
.result{background:var(--card);border-radius:22px;border:2px solid var(--line);padding:26px;text-align:center}
.result .bigstars{font-size:58px;letter-spacing:8px;color:var(--gold)}
.result .bigstars .off{color:#e2dccf}
.result h2{margin:6px 0}
.result .score{font-size:44px;font-weight:900;color:var(--accent)}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;text-align:left}
.sec{background:#faf7f1;border-radius:12px;padding:8px 12px;font-size:15px}
.sec b{display:block;font-size:18px}
.review{margin-top:22px;text-align:left}
.ritem{border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px;background:#fff}
.ritem .rq{font-size:17px}
.ritem .ry{color:var(--bad);font-size:16px;margin-top:4px}
.ritem .rc{color:var(--ok);font-weight:700;font-size:16px}
.ritem .re{color:#4a4f57;font-size:15px;margin-top:2px}
.ritem.okk{border-color:#bfe3cc}
.navx{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.navx button{width:36px;height:36px;border-radius:9px;border:2px solid var(--line);background:#fff;font-size:14px}
.navx button.done{background:var(--soft);border-color:var(--accent)}
.navx button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{margin-top:28px;text-align:center;color:#8b8577;font-size:14px}

@media (max-width:720px){
  body{font-size:17px}
  .grid,.units{grid-template-columns:1fr}
  .hero h1{font-size:24px}
  .stem{font-size:19px}
  .phrase{font-size:28px;letter-spacing:2px}
  .opts.zy{grid-template-columns:repeat(2,1fr)}
  .opt{font-size:17px;padding:10px 12px}
  .qcard{padding:16px}
  .secs{grid-template-columns:repeat(2,1fr)}
  .sent{font-size:23px}
  .ch{min-width:32px}
  .qhead .name{font-size:16px;min-width:0;flex-basis:60%}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ================= 題目建構工具 ================= */
const LESSONS = [];
let _gid = 0;
const SPLIT = s => Array.from(s);
const word = (s, a) => s.replace(/「(.+?)」/, a).replace(/[「」]/g, "");
const MC = (q, opts, exp, tag) => ({ t: "mc", q, opts, exp, tag });
const FX = (q, opts, exp, tag) => ({ t: "mc", q, opts, exp, tag, fx: true });
// 注音 → 國字：Z(題目, 正解, 干擾字串, 補充)
const Z = (s, a, d, note) => ({ t: "mc", kind: "zy", ph: s, q: "", opts: ["*" + a].concat(SPLIT(d)), tag: "注音寫國字",
  exp: `正確寫法：${word(s, a)}。${note || ""}` });
// 國字 → 注音：Y(題目, 正解, 干擾（空白分隔）, 補充)
const Y = (s, a, d, note) => ({ t: "mc", kind: "zy", bp: true, ph: s, q: "", opts: ["*" + a].concat(d.split(" ")), tag: "國字寫注音",
  exp: `「${(s.match(/「(.+?)」/) || [, ""])[1]}」在「${s.replace(/[「」]/g, "")}」中讀 ${a}。${note || ""}` });
// 注釋：N(語詞, 正解, 干擾（| 分隔）, 補充)
const N = (s, a, d, note) => ({ t: "mc", kind: "nt", ph: s, q: "", opts: ["*" + a].concat(d.split("|")), tag: "注釋",
  exp: `${s}：${a}。${note || ""}` });
// 句型判斷：SE(句子, 句型代號 0敘事 1有無 2判斷 3表態, 說明)
const STYPES = ["敘事句", "有無句", "判斷句", "表態句"];
const SE = (s, k, exp) => ({ t: "mc", kind: "se", ph: s, q: "", opts: STYPES.map((x, i) => (i === k ? "*" : "") + x), fx: true, tag: "句型判斷", exp });
// 改錯字：E("句子{錯>正}句子", 說明)
const E = (s, exp) => { const m = s.match(/\{(.)>(.)\}/); const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
  const chars = SPLIT(pre).concat([m[1]]).concat(SPLIT(post)); return { t: "err", chars, ei: SPLIT(pre).length, bad: m[1], good: m[2], exp: exp || "", tag: "改錯字" }; };
const GR = (title, html, notes, qs) => { const id = "p" + (++_gid); return qs.map(x => Object.assign(x, { psg: { id, title, html, notes }, tag: x.tag || "閱讀測驗" })); };
</script>

  Y("美名遠「播」", "ㄅㄛˋ", "ㄅㄛ ㄆㄛ ㄈㄢ"),

const ZY5 = [
  Z("「ㄓㄥˋ」重其事", "鄭", "正政證", "鄭重：嚴肅認真。"),
  Z("編「ㄗㄨㄢˇ」", "纂", "篡撰鑽", "纂：編輯。「篡」（ㄘㄨㄢˋ）是奪取，字形相近別寫錯。"),

<script>
/* ================= 練習引擎 ================= */

/* ---------- 小工具 ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const strip = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "");
const hl = s => esc(s).replace(/「(.+?)」/g, '<span class="hl">$1</span>');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }
function starsOf(pct) { return pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0; }
function starHTML(n, max = 3) { let h = ""; for (let i = 0; i < max; i++) h += i < n ? "★" : '<span class="off">★</span>'; return '<span class="stars">' + h + "</span>"; }
const studyUnits = L => L.units.filter(u => !u.exam);
function lessonStars(L) { return studyUnits(L).reduce((s, u) => s + ((P.units[u.id] || {}).stars || 0), 0); }
function totalStars() { return LESSONS.reduce((s, L) => s + lessonStars(L), 0); }
function rankOf(st) {
  const max = TOTAL_UNITS * 3;
  if (st >= max) return "👑 國文王者";
  if (st >= 40) return "🏅 段考達人";
  if (st >= 25) return "⚔️ 闖關高手";
  if (st >= 10) return "📜 國文探險家";

function mockUnlocked() {

}
function setTheme(c, soft) { document.documentElement.style.setProperty("--accent", c); document.documentElement.style.setProperty("--soft", soft); }

/* ================= 首頁 ================= */
function showHome() {

    <footer>八年級國文 第二次段考 L4–L6・語文常識二 練習</footer>`;

function alertBox(t, m) {

/* ================= 課次頁 ================= */
function showLesson(id) {

    <div class="banner" style="background:linear-gradient(135deg,${L.color},${L.color}cc)"><div class="big">${L.icon}</div>

/* ================= 建立測驗 ================= */
function prep(q) {
  const o = Object.assign({}, q);
  if (o.t === "mc") {
    const raw = o.opts.map(s => ({ txt: s.replace(/^\*/, ""), ok: s[0] === "*" }));
    const sh = o.fx ? raw : shuffle(raw);
    o.o = sh.map(x => x.txt); o.ci = sh.findIndex(x => x.ok);
  }
  return o;
}
function orderItems(qs) {
  const singles = qs.filter(q => !q.psg), groups = [];
  qs.filter(q => q.psg).forEach(q => { let g = groups.find(x => x[0].psg.id === q.psg.id); if (!g) groups.push(g = []); g.push(q); });
  return shuffle(singles).concat(shuffle(groups).flat()).map(prep);
}
function newQ(extra) { return Object.assign({ i: 0, xp: 0, combo: 0, best: 0, psgOpen: true }, extra, { ans: extra.items.map(() => null), res: extra.items.map(() => null) }); }
function startUnit(lid, uid) {
  const L = LESSONS.find(x => x.id === lid), U = L.units.find(x => x.id === uid);
  setTheme(L.color, L.soft);
  Q = newQ({ mode: "practice", L, U, title: `${L.title}｜${U.title}`, items: orderItems(U.qs) });
  renderQ();
}
function retryWrong() {
  const wrong = Q.items.filter((q, k) => !(Q.res[k] && Q.res[k].ok));
  if (!wrong.length) return;
  const L = Q.L, U = Q.U;
  Q = newQ({ mode: "practice", retry: true, L, U, title: `${L.title}｜${U.title}（錯題再練）`, items: orderItems(wrong) });
  renderQ();
}
function startMock() {
  setTheme(MOCK.color, MOCK.soft);
  const items = [];
  MOCK.sections.forEach((s, si) => s.draw().forEach(q => { const o = prep(q); o.sec = si; o.pts = s.pts; items.push(o); }));
  Q = newQ({ mode: "exam", L: LESSONS.find(x => x.id === "REV"), title: "🏆 模擬段考", items });
  renderQ();
}

/* ================= 判斷對錯 ================= */
function isRight(q, a) {
  if (a == null) return false;
  if (q.t === "mc") return a === q.ci;
  if (q.t === "err") return a === q.ei;
  return false;
}
function corrText(q) {
  if (q.t === "mc") return `(${"ABCD"[q.ci]}) ${q.o[q.ci]}`;
  if (q.t === "err") return `「${q.bad}」應改為「${q.good}」`;
}
function givenText(q, a) {
  if (a == null) return "（未作答）";
  if (q.t === "mc") return `(${"ABCD"[a]}) ${q.o[a]}`;
  if (q.t === "err") return `點了「${q.chars[a]}」`;
}
function stemText(q) {
  if (q.t === "err") return "找錯字：" + q.chars.map((c, k) => k === q.ei ? "【" + c + "】" : c).join("");
  let s = "";
  if (q.psg) s = `【${q.psg.title}】`;
  if (q.kind === "zy") return s + q.ph;
  if (q.kind === "nt") return s + q.ph + "　的意思";
  if (q.kind === "se") return s + q.ph;
  return s + strip(q.q);
}
const isPunc = c => /[，。、；：？！「」『』（）…—\s]/.test(c);

/* ================= 作答畫面 ================= */
function renderQ() {
  const q = Q.items[Q.i], n = Q.items.length, done = Q.res[Q.i] != null, exam = Q.mode === "exam";
  const a = Q.ans[Q.i];
  const correct = Q.res.filter(r => r && r.ok).length;
  let head = `<div class="qhead"><button class="back" onclick="quitQ()">✕</button><div class="name">${Q.title}</div>
    <span class="pill">${Q.i + 1} / ${n}</span>`;
  if (exam) head += `<span class="pill">${MOCK.sections[q.sec].name}（每題 ${q.pts} 分）</span>`;
  else head += `<span class="pill">✔ ${correct}</span><span class="pill">${Q.xp} XP</span>${Q.combo >= 2 ? `<span class="pill combo">🔥 ${Q.combo} 連擊</span>` : ""}`;
  head += `</div><div class="prog"><i style="width:${(exam ? Q.ans.filter(x => x != null).length : Q.res.filter(Boolean).length) / n * 100}%"></i></div>`;

  let psg = "";
  if (q.psg) {
    psg = `<div class="psg"><div class="ph"><span>📖 閱讀　<b>${q.psg.title}</b></span><button class="tog" onclick="Q.psgOpen=!Q.psgOpen;renderQ()">${Q.psgOpen ? "收合文章 ▲" : "展開文章 ▼"}</button></div>
      <div class="body ${Q.psgOpen ? "" : "hidden"}">${q.psg.html}${q.psg.notes ? `<div class="notes">📝 ${q.psg.notes}</div>` : ""}</div></div>`;
  }

  let card = `<div class="qcard"><span class="tag">${q.tag || "選擇題"}</span>`;
  const lock = done && !exam;

  if (q.t === "mc") {
    let gridCls = "";
    if (q.kind === "zy") {
      card += `<div class="ask">${q.bp ? "請選出「 」內國字的正確注音" : "請選出「 」內注音的正確國字"}</div><div class="phrase">${hl(q.ph)}</div>`;
      gridCls = "zy";
    } else if (q.kind === "nt") {
      card += `<div class="phrase">${hl(q.ph)}</div><div class="ask">${/「/.test(q.ph) ? "「 」內字詞的意思是？" : "這個語詞的意思是？"}</div>`;
    } else if (q.kind === "se") {
      card += `<div class="phrase" style="font-size:26px;letter-spacing:2px">${esc(q.ph)}</div><div class="ask">${q.q || (q.tag === "論證法判斷" ? "這段文字運用了哪一種論證法？" : "這個句子屬於哪一種句型？")}</div>`;
      gridCls = q.two || q.o.length === 4 ? "two" : "";
    } else {
      card += `<div class="stem">${q.q}</div>`;
    }
    card += `<div class="opts ${gridCls}">`;
    q.o.forEach((t, k) => {
      let cls = "";
      if (lock) { if (k === q.ci) cls = "right"; else if (k === a) cls = "wrong"; }
      else if (a === k) cls = "sel";
      const v = q.kind === "zy" ? `<span class="v ${q.bp ? "bpmf" : ""}">${t}</span>` : `<span>${t}</span>`;
      card += `<button class="opt ${cls}" ${lock ? "disabled" : ""} onclick="pick(${k})"><span class="k">${"ABCD"[k]}</span>${v}</button>`;
    });
    card += `</div>`;
  } else if (q.t === "err") {
    card += `<div class="ask">這個句子裡有一個錯字，請點出來！</div><div class="sent">`;
    q.chars.forEach((c, k) => {
      if (isPunc(c)) { card += `<span class="pu">${c}</span>`; return; }
      let cls = "", fix = "";
      if (lock) { if (k === q.ei) { cls = "right"; fix = `<span class="fix">${q.good}</span>`; } else if (k === a) cls = "wrong"; }
      else if (a === k) cls = "sel";
      card += `<button class="ch ${cls}" ${lock ? "disabled" : ""} onclick="pick(${k})">${fix}${c}</button>`;
    });
    card += `</div>`;
  }

  let tools = "";
  if (exam) {
    tools = `<div class="tools"><button class="btn ghost" ${Q.i === 0 ? "disabled" : ""} onclick="move(-1)">← 上一題</button>
      ${Q.i < n - 1 ? `<button class="btn" onclick="move(1)">下一題 →</button>` : ""}
      <button class="btn" style="background:#b07800" onclick="submitExam()">📮 交卷</button></div>
      <div class="navx">${Q.items.map((_, k) => `<button class="${k === Q.i ? "cur" : Q.ans[k] != null ? "done" : ""}" onclick="jump(${k})">${k + 1}</button>`).join("")}</div>`;
  } else if (done) {
    const r = Q.res[Q.i];
    tools = `<div class="fb ${r.ok ? "ok" : "no"}"><div class="h">${r.ok ? "✔ 答對了！" + (r.gain ? ` +${r.gain} XP` : "") : "✘ 再想想！正確答案是："}</div>
      ${r.ok ? "" : `<div class="ca">${corrText(q)}</div>`}
      <div class="ex">💬 ${q.exp}</div></div>
      <div class="tools"><button class="btn" id="nextBtn" onclick="nextQ()">${Q.i < n - 1 ? "下一題 →" : "看結果 🏁"}</button></div>`;
  }
  card += tools + `</div>`;
  $app.innerHTML = head + psg + card;
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({ preventScroll: true });
}

/* ---------- 互動 ---------- */
function pick(k) {
  if (Q.mode === "exam") { Q.ans[Q.i] = k; renderQ(); return; }
  if (Q.res[Q.i]) return;
  Q.ans[Q.i] = k; check();
}
function check() {
  const q = Q.items[Q.i], a = Q.ans[Q.i];
  const ok = isRight(q, a);
  let gain = 0;
  if (ok) { Q.combo++; gain = 10 + (Q.combo >= 3 ? Math.min(Q.combo - 2, 5) * 2 : 0); Q.xp += gain; Q.best = Math.max(Q.best, Q.combo); flash("+" + gain + " XP", null); }
  else Q.combo = 0;
  Q.res[Q.i] = { ok, gain };
  renderQ();
}
function flash(t, color) { const d = document.createElement("div"); d.className = "xp-pop"; d.textContent = t; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
function nextQ() { if (Q.i < Q.items.length - 1) { Q.i++; renderQ(); scrollTop(); } else finishPractice(); }
function move(d) { Q.i = Math.min(Math.max(Q.i + d, 0), Q.items.length - 1); renderQ(); scrollTop(); }
function jump(k) { Q.i = k; renderQ(); scrollTop(); }
function scrollTop() { scrollTo({ top: 0, behavior: "smooth" }); }
document.addEventListener("keydown", e => {
  if (!Q || e.target.tagName === "INPUT") return;
  const q = Q.items[Q.i];
  if (e.key === "Enter") { const nb = document.getElementById("nextBtn"); if (nb) { e.preventDefault(); nb.click(); } return; }
  if (q.t === "mc") { const k = "1234abcd".indexOf(e.key.toLowerCase()) % 4; if (k >= 0 && k < q.o.length && !(Q.mode !== "exam" && Q.res[Q.i])) pick(k); }
});
function quitQ() {
  const started = Q.ans.some(x => x != null);
  if (started && !window.confirm("確定要離開嗎？這次的作答不會記錄。")) return;
  showLesson(Q.L.id);
}

/* ================= 結果 ================= */
function reviewHTML(onlyWrong) {
  return Q.items.map((q, k) => {
    const ok = Q.res[k] && Q.res[k].ok;
    if (onlyWrong && ok) return "";
    return `<div class="ritem ${ok ? "okk" : ""}"><div class="rq"><b>${k + 1}.</b> ${esc(stemText(q))}</div>
      ${ok ? "" : `<div class="ry">你的答案：${givenText(q, Q.ans[k])}</div>`}
      <div class="rc">${ok ? "✔ " : "正解："}${corrText(q)}</div><div class="re">💬 ${q.exp}</div></div>`;
  }).join("");
}
function finishPractice() {
  const n = Q.items.length, c = Q.res.filter(r => r && r.ok).length, pct = c / n, st = starsOf(pct);
  let newBest = false;
  if (!Q.retry) {
    const prev = P.units[Q.U.id] || {};
    newBest = st > (prev.stars || 0);
    P.units[Q.U.id] = { stars: Math.max(st, prev.stars || 0), best: Math.max(pct, prev.best || 0) };
  }
  P.xp += Q.xp; saveP();
  const list = Q.L.units, idx = list.findIndex(u => u.id === Q.U.id), nu = list[idx + 1];
  const msg = st === 3 ? "太強了！完美過關 🎉" : st === 2 ? "很不錯！再挑戰拿三顆星吧！" : st === 1 ? "過關了！把錯題看一遍再挑戰。" : "別灰心，看完詳解再試一次！";
  const wrong = n - c;
  const nextBtn = nu && !nu.exam ? `<button class="btn ghost" onclick="startUnit('${Q.L.id}','${nu.id}')">下一單元：${nu.title} →</button>` : `<button class="btn ghost" onclick="showLesson('${Q.L.id}')">回 ${Q.L.title}</button>`;
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showLesson('${Q.L.id}')">← 回 ${Q.L.title}</button></div>
    <div class="result"><div class="bigstars">${starHTML(st).replace('class="stars"', "")}</div>
      <h2>${Q.U.icon} ${Q.U.title}${Q.retry ? "（錯題再練）" : ""}</h2><div class="score">${c} / ${n}</div>
      <div>${msg}${newBest ? "　<b>（新紀錄！）</b>" : ""}</div>
      <div style="margin-top:8px;color:var(--muted)">本次獲得 <b>${Q.xp} XP</b>・最高連擊 🔥 ${Q.best}${Q.retry ? "・錯題再練不列入星等" : ""}</div>
      <div class="tools" style="justify-content:center">
        <button class="btn" onclick="startUnit('${Q.L.id}','${Q.U.id}')">↻ 整個單元再挑戰</button>
        ${wrong ? `<button class="btn" style="background:#c43c2f" onclick="retryWrong()">🎯 只練錯題（${wrong} 題）</button>` : ""}
        ${nextBtn}
      </div></div>
    <div class="review"><h3>${wrong ? `📌 錯題回顧（${wrong} 題）` : "📌 全部答對！以下是本單元詳解"}</h3>${reviewHTML(wrong > 0)}</div>`;
  scrollTo(0, 0);
}
function submitExam() {
  const blank = Q.ans.filter(x => x == null).length;
  if (blank && !window.confirm(`還有 ${blank} 題沒有作答，確定要交卷嗎？`)) return;
  let score = 0; const secs = MOCK.sections.map(s => ({ name: s.name, c: 0, n: 0, pts: 0, max: 0 }));
  Q.items.forEach((q, k) => { const ok = isRight(q, Q.ans[k]); Q.res[k] = { ok }; const s = secs[q.sec]; s.n++; s.max += q.pts; if (ok) { s.c++; s.pts += q.pts; score += q.pts; } });
  const first = P.mock == null;
  P.mock = Math.max(P.mock || 0, score); P.xp += score; saveP();
  const lv = score >= 90 ? "A++ 段考神人 👑" : score >= 80 ? "A 準備充分 🏅" : score >= 60 ? "B 再加把勁 💪" : "C 先回各課複習 📚";
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showLesson('REV')">← 回段考複習</button></div>
    <div class="result"><div style="font-size:52px">🏆</div><h2>模擬段考成績</h2>
      <div class="score">${score} 分</div><div><b>${lv}</b>${!first && score >= P.mock ? "　（最佳紀錄）" : ""}</div>
      <div class="secs">${secs.map(s => `<div class="sec">${s.name}<b>${s.pts} / ${s.max} 分</b>答對 ${s.c} / ${s.n}</div>`).join("")}</div>
      <div class="tools" style="justify-content:center"><button class="btn" onclick="startMock()">↻ 換一份新考卷</button><button class="btn ghost" onclick="showHome()">回首頁</button></div></div>
    <div class="review"><h3>📌 錯題詳解（${Q.res.filter(r => !r.ok).length} 題）</h3>${reviewHTML(true)}</div>`;
  scrollTo(0, 0);
}

showHome();
</script>
