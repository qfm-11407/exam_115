<meta charset="UTF-8">

<title>八年級英文 第二次段考強化練習</title>
<script id="pe115-level">
/* 一一五上學期段考強化練習｜練習等級（共用元件，各練習頁相同）
   100%＝★★★★★、90%＝★★★★、80%＝★★★、70%＝★★、60%＝★，未滿 60% 尚未評級
   成績存在 localStorage「pe115:levels」，入口網站讀同一份資料顯示各科練習等級。 */
window.PE115 = (function () {
  var KEY = 'pe115:levels';
  var m = location.pathname.match(/([a-z]+115010\d)\.html?$/i);
  var FILE = m ? m[1].toLowerCase() + '.html' : null;
  function stars(p) { p = +p || 0; return p >= 99.95 ? 5 : p >= 90 ? 4 : p >= 80 ? 3 : p >= 70 ? 2 : p >= 60 ? 1 : 0; }
  function starStr(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function get() { return FILE ? load()[FILE] || null : null; }
  function label(p) { var s = stars(p); return s ? '練習等級 ' + starStr(s) : '尚未評級'; }
  function commit(pct, note, thisRun) {
    if (!FILE) return;
    var d = load(), r = d[FILE] || { best: 0, tries: 0 };
    var before = stars(r.best);
    r.tries = (r.tries || 0) + 1; r.last = Math.round(pct); r.best = Math.max(r.best || 0, Math.round(pct));
    r.stars = stars(r.best); r.at = Date.now(); if (note) r.note = note;
    d[FILE] = r; save(d); paint();
    toast(thisRun, r, before, note);
  }
  /* 單一段考衝刺測驗：pct 為 0–100 */
  function report(pct, note) { commit(pct, note, Math.round(pct)); }
  /* 由多份測驗合成（例：兩關取較低、三科模擬卷平均）；未做的部分以 0 計 */
  function part(id, pct, allIds, mode, note) {
    if (!FILE) return;
    var d = load(), r = d[FILE] || { best: 0, tries: 0 };
    r.parts = r.parts || {}; r.parts[id] = Math.max(r.parts[id] || 0, Math.round(pct));
    d[FILE] = r; save(d);
    var vals = allIds.map(function (k) { return r.parts[k] || 0; });
    var agg = mode === 'min' ? Math.min.apply(null, vals) : vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    commit(agg, note + ' ' + Math.round(agg) + '%', Math.round(pct));
  }
  function paint() {
    var r = get(), els = document.querySelectorAll('.pe-level');
    for (var i = 0; i < els.length; i++) {
      var html = r && r.stars
        ? '<b>' + label(r.best) + '</b>（段考衝刺最佳 ' + r.best + '%' + (r.note ? '・' + r.note.replace(/ \d+%$/, '') : '') + '）'
        : '練習等級：尚未評級（段考衝刺答對 60% 以上就會評級）';
      if (els[i].getAttribute('data-pe') !== html) { els[i].innerHTML = html; els[i].setAttribute('data-pe', html); }
    }
  }
  function toast(thisRun, r, before, note) {
    var t = document.getElementById('pe-toast');
    if (!t) { t = document.createElement('div'); t.id = 'pe-toast'; document.body.appendChild(t); }
    var up = r.stars > before;
    t.innerHTML = '本次 ' + thisRun + '%' + (note ? '｜' + note : '') + '<br><b>' + (r.stars ? label(r.best) : '練習等級：尚未評級') + '</b>' + (up ? '　⬆ 升級！' : '');
    t.className = 'show';
    clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, 5000);
  }
  var css = document.createElement('style');
  css.textContent = '#pe-toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:2147483001;' +
    'background:rgba(31,36,51,.94);color:#fff;padding:12px 20px;border-radius:14px;text-align:center;line-height:1.6;' +
    'font:600 15px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:.3s}' +
    '#pe-toast.show{opacity:1;transform:translate(-50%,0)}#pe-toast b{color:#ffd43b;font-size:17px}' +
    '.pe-level b{letter-spacing:1px}@media print{#pe-toast{display:none}}';
  document.head.appendChild(css);
  function watch() {
    paint();
    try { new MutationObserver(function () { if (document.querySelector('.pe-level:not([data-pe])')) paint(); })
      .observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  return { stars: stars, starStr: starStr, label: label, report: report, part: part, get: get, paint: paint };
})();
</script>

<script>
/* ================= 題目建構工具 ================= */
const LESSONS = [];
let _gid = 0;
const MC  = (q, opts, exp, tag) => ({ t: "mc", q, opts, exp, tag });
const SP  = (q, zh, exp) => ({ t: "sp", q, zh, exp, tag: "文意字彙" });
const FI  = (q, ans, exp, tag) => ({ t: "fi", q, ans, exp, tag });
const RW  = (q, hint, ans, exp) => ({ t: "rw", q, hint, ans, exp, tag: "依提示改寫" });
const OR  = (zh, en, alts, exp) => ({ t: "or", zh, en, alts: alts || [], exp, tag: "整句翻譯（字卡重組）" });
const SQ  = (q, items, exp) => ({ t: "sq", q, items, exp, tag: "事件排序" });
const CZ  = (b, opts, exp) => ({ t: "mc", q: "空格 " + b, b, opts, exp });
const CLK = (o, h, m) => Object.assign(o, { clk: [h, m], tag: o.tag || "時間說法" });
const GR  = (kind, title, html, notes, qs) => { const id = "p" + (++_gid); return qs.map(x => Object.assign(x, { psg: { id, kind, title, html, notes }, tag: x.tag || (kind === "cloze" ? "克漏字" : "閱讀測驗") })); };
</script>
<script>
/* ===== L3 Tina and Billy Were Looking for Water ===== */
LESSONS.push({
  id: "L3", icon: "🐦", color: "#6741d9", soft: "#efeafd",
  title: "Lesson 3", en: "Tina and Billy Were Looking for Water",
  badge: "森林探險家",
  points: ["when / before / after", "過去進行式 was / were + V-ing", "時間說法 a quarter / half / to / past", "動物與故事單字"],
  units: [
  {
    id: "L3-1", icon: "🔤", title: "單字闖關", desc: "文意字彙・字彙選擇・一字多義",
    qs: [
      SP("It was a sunny day, and the sky was [clear]. We could see the mountains far away.", "晴朗的", "sky 天空很「晴朗」，所以看得到遠方的山。"),
      SP("My cat is too small. It can't [reach] the fish on the table.", "伸手拿到；達到", "貓太小，「搆不到」桌上的魚。can't 後面接原形動詞 reach。"),

    { name: "三、克漏字選擇", pts: 2, qs: [].concat(
      GR("cloze", "A Card from My Brother",
        "<p><b>Mia:</b> You look happy today, Ken. What happened?</p><p><b>Ken:</b> My little brother made me a card. {1} I got home yesterday, he gave it to me.</p><p><b>Mia:</b> How sweet! Why did he do that?</p><p><b>Ken:</b> Last week, he was crying because he couldn't {2} his kite. It was in a tree. So I got it down for him.</p><p><b>Mia:</b> You're a good big brother.</p><p><b>Ken:</b> Thanks. {3}</p>",

      GR("cloze", "Grace's Dream Job",

        "save 拯救　college 大學",
        [
          CZ(1, ["*lived", "lives", "is living", "live"], "When Grace was young → 過去式 lived。"),
          CZ(2, ["*When", "So", "But", "Or"], "「當」她十五歲時 → When。"),
          CZ(3, ["*to be", "being", "be", "is"], "plan ＋ to V。"),
          CZ(4, ["*so", "but", "because", "before"], "努力讀書，「所以」上了好大學 → so。"),
          CZ(5, ["*She is happy to help animals every day.", "She doesn't like cats anymore.", "She wants to live in a big city.", "She was a sick girl when she was young."], "她實現了當獸醫的夢想 → 每天開心地幫助動物。")

    },
    { name: "四、閱讀測驗", pts: 2, qs: [].concat(
      GR("read", "A Day on the Farm",
        "<p><b>Ivy:</b> I called you at three yesterday afternoon, but you didn't answer.</p><p><b>Sean:</b> Sorry. I was helping my grandpa on his farm.</p><p><b>Ivy:</b> A farm? What did you do there?</p><p><b>Sean:</b> First, I fed the chickens and ducks. Then Grandpa and I picked up eggs. When we were walking back to the house, a goose ran after me!</p><p><b>Ivy:</b> Ha-ha! Did it hurt you?</p><p><b>Sean:</b> No, but I was scared, and I dropped all the eggs.</p><p><b>Ivy:</b> Oh, no! What did your grandpa say?</p><p><b>Sean:</b> He just laughed. He said, “Don't worry. The chickens can give us more tomorrow.”</p>",
        "feed / fed 餵　run after 追趕　hurt 傷害",
        [
          MC("Why didn't Sean answer Ivy's call?", ["*He was busy on his grandpa's farm.", "He was sleeping.", "He dropped his phone.", "He was at school."], "I was helping my grandpa on his farm."),
          MC("What happened when Sean and his grandpa were walking back to the house?", ["*A goose ran after Sean.", "A chicken hurt Sean.", "Grandpa dropped the eggs.", "Sean fed the ducks."], "When we were walking back to the house, a goose ran after me!"),

        ]),
      GR("read", "Class 802 Field Trip",
        "<p>Class 802 went to Taipei Zoo last Friday. Here is their schedule.</p><table class='sch'><tr><th>Time</th><th>What to do</th></tr><tr><td>8:00–9:00</td><td>Take the bus to the zoo</td></tr><tr><td>9:00–10:30</td><td>Visit the animals in the Africa area</td></tr><tr><td>10:30–10:45</td><td>Take a break</td></tr><tr><td>10:45–12:00</td><td>See the pandas</td></tr><tr><td>12:00–1:00</td><td>Have lunch</td></tr><tr><td>1:00–2:30</td><td>Visit the Insect House</td></tr><tr><td>2:30–3:30</td><td>Take the bus back to school</td></tr></table>",
        "field trip 校外教學　insect 昆蟲　panda 貓熊",
        [
          MC("What were the students doing at a quarter past eleven?", ["*They were seeing the pandas.", "They were having lunch.", "They were taking a break.", "They were visiting the Insect House."], "a quarter past eleven = 11:15，在 10:45–12:00 → 看貓熊。"),
          MC("When did the students take a break?", ["*From half past ten to a quarter to eleven.", "From a quarter to ten to half past ten.", "From half past nine to a quarter past ten.", "From eleven to twelve."], "10:30–10:45 = half past ten 到 a quarter to eleven。"),
          MC("Which is true?", ["The students had lunch before they saw the pandas.", "*The students visited the Insect House after lunch.", "The students took the train to the zoo.", "The trip ended at half past two."], "(A) 先看貓熊再吃午餐；(C) 搭公車；(D) 3:30 才回到學校。")
        ]),
      GR("read", "Yu-ting's Dance Dream",
        "<p>Lin Yu-ting was not good at studying when she was in junior high school, but she had a gift for dancing. She practiced dancing every day after school, and she often danced until nine at night.</p><p>In 2015, when she was sixteen, she entered a dance contest on TV. Sadly, she fell during the show and didn't win. She felt sad, but she didn't stop dancing.</p><p>Two years later, she entered the contest again, and this time she won first place. Now she has her own dance school, and teaching kids to dance is her favorite thing.</p>",
        "enter 參加　contest 比賽　fall / fell 跌倒　own 自己的",
        [
          MC("How old was Yu-ting when she won first place?", ["15.", "16.", "*18.", "20."], "2015 年 16 歲，兩年後（2017）得到第一名 → 18 歲。", "推算"),
          MC("What does “she had a gift for dancing” mean?", ["*She was very good at dancing.", "Someone gave her a present.", "She bought new dancing shoes.", "She didn't like dancing."], "gift 在這裡是「天分」。", "字義推測"),
          MC("Which is NOT true?", ["Yu-ting practiced dancing after school.", "Yu-ting fell during her first TV contest.", "*Yu-ting stopped dancing after she lost.", "Yu-ting teaches kids to dance now."], "文中說 she didn't stop dancing。")
        ]),
      GR("read", "Summer Helpers Wanted",
        "<div class='notice'><h4>Lucky Café Is Looking for Summer Helpers!</h4><ul><li><b>Waiter / Waitress:</b> Work from 11:00 a.m. to 3:00 p.m. You need to be friendly and enjoy talking with people.</li><li><b>Kitchen helper:</b> Work from 7:00 a.m. to 11:00 a.m. Washing dishes and cutting vegetables are your main jobs.</li><li><b>Social media helper:</b> Work at home two hours a day. You need to be good at taking pictures and making short videos.</li></ul><p><b>Pay:</b> NT$200 an hour<br>Call Ms. Chang at 02-2345-6789 before July 1.</p></div>",
        "friendly 友善的　main 主要的　pay 工資",
        [
          MC("What is this ad for?", ["*Finding people to work at the café.", "Selling coffee and cakes.", "A cooking class.", "A summer party."], "Looking for Summer Helpers → 徵求暑期幫手。", "主旨"),
          MC("Jack is good at making videos, but he has to stay home and take care of his little sister. Which job is good for him?", ["*Social media helper.", "Waiter.", "Kitchen helper.", "None of them."], "Social media helper 可以在家工作，而且需要會拍照、做影片。"),
          MC("How much does a kitchen helper make a day?", ["NT$200.", "NT$400.", "*NT$800.", "NT$1,000."], "7:00–11:00 共 4 小時 × NT$200 = NT$800。", "推算"),
          MC("Which is true?", ["Waiters work in the morning only.", "*Kitchen helpers need to wash dishes.", "Ms. Chang is a reporter.", "You can call after July 1."], "Washing dishes and cutting vegetables are your main jobs.")
        ]),
      GR("read", "Being a Child Star",
        "<p>Many kids dream of being stars. Being a child star looks exciting. Child stars can be on TV, meet famous people, and make a lot of money. People know their names, and fans take pictures with them.</p><p>However, there are two sides to everything. Child stars often have to work long hours. They sometimes stay up to finish their work, so they feel tired at school. Also, it is hard for them to go out with friends because people always look at them. Some child stars even stop going to school.</p><p>So, do you still want to be a child star? Think about it before you make your choice.</p>",
        "child star 童星　fan 粉絲　choice 選擇",
        [
          MC("What is the reading mainly about?", ["*The good and bad sides of being a child star.", "How to become a child star.", "The names of famous child stars.", "Why kids love watching TV."], "第一段寫好處，第二段寫壞處 → 童星的優缺點。", "主旨"),
          MC("Which is a good thing about being a child star?", ["*They can make a lot of money.", "They feel tired at school.", "They work long hours.", "They can't go out with friends."], "Child stars can… make a lot of money。"),
          MC("Why is it hard for child stars to go out with friends?", ["*People always look at them.", "They don't have any friends.", "Their parents say no.", "They have to go to school."], "because people always look at them。"),
          MC("Which is NOT mentioned in the reading?", ["Child stars can meet famous people.", "Child stars sometimes stay up.", "*Child stars have to learn many languages.", "Some child stars stop going to school."], "文中沒有提到學很多語言。")
        ]))
    },
    { name: "五、依提示改寫", pts: 3, qs: [
      RW("My sister sings songs every night.", "加入 enjoy 改寫", ["My sister enjoys singing songs every night."], "enjoy ＋ V-ing；主詞單數 → enjoys。"),
      RW("Peter took a shower after he played tennis.", "用 … before … 改寫", ["Peter played tennis before he took a shower.", "Before Peter took a shower, he played tennis.", "Before he took a shower, Peter played tennis."], "先打網球再洗澡 → 打網球 before 洗澡。"),
      RW("It is important for us to protect the earth.", "以動名詞為句首改寫", ["Protecting the earth is important for us."], "to protect → Protecting 放句首，用 is。protect 保護")
    ]},
    { name: "六、整句式翻譯", pts: 3, qs: [
      OR("你昨天晚上八點半在做什麼？", "What were you doing at half past eight last night?", [], "過去時間點正在做 → What were you doing…？8:30 = half past eight。"),
      OR("當 Amy 看到那隻小狗時，她很開心。", "Amy was happy when she saw the little dog.", ["When Amy saw the little dog, she was happy."], "when 子句可放句首或句尾。"),
      OR("Ken 想要成為一位記者，因為他喜歡寫故事。", "Ken wants to be a reporter because he likes writing stories.", [], "want ＋ to V；like ＋ V-ing。")
    ]}
  ]
};

</script>
<script>
/* ================= 練習引擎 ================= */
const KEY = "english1150102:progress-v1", OLD_KEY = "eng1150102_progress";
const TOTAL_UNITS = LESSONS.reduce((s, l) => s + l.units.length, 0);
let P = loadP(); migrateStars();
let Q = null;           // 目前作答中的測驗
const $app = document.getElementById("app");

function loadP() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!d) { try { d = JSON.parse(localStorage.getItem(OLD_KEY)); if (d) { localStorage.setItem(KEY, JSON.stringify(d)); localStorage.removeItem(OLD_KEY); } } catch (e) {} }
  return Object.assign({ units: {}, xp: 0, mock: null }, d || {});
}
function saveP() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

/* ---------- 小工具 ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const strip = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const CONTR = { "it's": "it is", "isn't": "is not", "aren't": "are not", "wasn't": "was not", "weren't": "were not", "don't": "do not", "doesn't": "does not", "didn't": "did not", "can't": "cannot", "couldn't": "could not", "i'm": "i am", "you're": "you are", "we're": "we are", "they're": "they are", "he's": "he is", "she's": "she is", "that's": "that is", "what's": "what is", "where's": "where is", "there's": "there is" };
function norm(s) {
  s = String(s || "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”"]/g, " ").replace(/[.,!?;:()（）。，！？、]/g, " ").replace(/\bcan not\b/g, "cannot");
  return s.split(/\s+/).filter(Boolean).map(w => CONTR[w] || w).join(" ");
}
const alts = a => String(a).split("|");
const tokensOf = en => en.split(/\s+/).map(w => w.replace(/[,.!?]+$/, ""));
function starsOf(pct) { return PE115.stars(pct * 100); }
function migrateStars() { Object.values(P.units || {}).forEach(u => { if (u && u.best != null) u.stars = starsOf(u.best); }); }
function starHTML(n, max = 5) { let h = ""; for (let i = 0; i < max; i++) h += i < n ? "★" : '<span class="off">★</span>'; return '<span class="stars">' + h + "</span>"; }
function lessonStars(L) { return L.units.reduce((s, u) => s + ((P.units[u.id] || {}).stars || 0), 0); }
function totalStars() { return LESSONS.reduce((s, L) => s + lessonStars(L), 0); }
function rankOf(st) {
  const max = TOTAL_UNITS * 5;
  if (st >= max) return "👑 英文王者";
  if (st >= 67) return "🏅 段考達人";
  if (st >= 42) return "⚔️ 闖關高手";
  if (st >= 17) return "🧭 英文探險家";
  return "🌱 見習生";
}
function mockUnlocked() {
  if (/unlock/.test(location.search + location.hash)) return true;
  return LESSONS.every(L => L.units.filter(u => ((P.units[u.id] || {}).stars || 0) >= 1).length >= 3);
}
function setTheme(c, soft) { document.documentElement.style.setProperty("--accent", c); document.documentElement.style.setProperty("--soft", soft); }

/* ---------- 時鐘 ---------- */
function clockSVG(h, m) {
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let nums = "";
  for (let i = 1; i <= 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    nums += `<text x="${100 + 72 * Math.cos(a)}" y="${100 + 72 * Math.sin(a) + 7}" text-anchor="middle" font-size="19" font-weight="700" fill="#33373d" font-family="Arial">${i}</text>`;
  }
  let ticks = "";
  for (let i = 0; i < 60; i++) {
    const a = (i * 6 - 90) * Math.PI / 180, r1 = i % 5 ? 88 : 84;
    ticks += `<line x1="${100 + r1 * Math.cos(a)}" y1="${100 + r1 * Math.sin(a)}" x2="${100 + 92 * Math.cos(a)}" y2="${100 + 92 * Math.sin(a)}" stroke="#555" stroke-width="${i % 5 ? 1 : 2.5}"/>`;
  }
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="時鐘"><circle cx="100" cy="100" r="96" fill="#fffdf6" stroke="var(--accent)" stroke-width="6"/>${ticks}${nums}
  <line x1="100" y1="100" x2="100" y2="52" stroke="#1f2328" stroke-width="7" stroke-linecap="round" transform="rotate(${ha} 100 100)"/>
  <line x1="100" y1="100" x2="100" y2="24" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" transform="rotate(${ma} 100 100)"/>
  <circle cx="100" cy="100" r="6" fill="#1f2328"/></svg>`;
}

/* ================= 首頁 ================= */
function showHome() {
  Q = null;
  setTheme("#6741d9", "#efeafd");
  const st = totalStars(), max = TOTAL_UNITS * 5, unlocked = mockUnlocked();
  let cards = LESSONS.map(L => {
    const s = lessonStars(L), m = L.units.length * 5;
    return `<button class="lcard" onclick="showLesson('${L.id}')">
      <div class="top"><div class="ico" style="background:${L.soft}">${L.icon}</div>
      <div><div class="ttl" style="color:${L.color}">${L.title}</div><div class="en">${L.en}</div></div></div>
      <div class="pts">${L.points.map(p => `<span class="chip">${p}</span>`).join("")}</div>
      <div class="bar"><i style="width:${s / m * 100}%;background:${L.color}"></i></div>
      <div class="meta"><span>${L.units.length} 個小單元</span><span>★ ${s} / ${m}${s === m ? "　🎖️ " + L.badge : ""}</span></div>
    </button>`;
  }).join("");
  const mb = P.mock ? `最佳成績 ${P.mock} 分` : "尚未挑戰";
  cards += `<button class="lcard ${unlocked ? "" : "locked"}" onclick="${unlocked ? "startMock()" : "lockedMsg()"}">
    ${unlocked ? "" : '<span class="lock">🔒 未解鎖</span>'}
    <div class="top"><div class="ico" style="background:${MOCK.soft}">${MOCK.icon}</div>
    <div><div class="ttl" style="color:${MOCK.color}">${MOCK.title}</div><div class="en">${MOCK.en}</div></div></div>
    <div class="pts"><span class="chip">字彙 12%</span><span class="chip">文法 20%</span><span class="chip">克漏字 16%</span><span class="chip">閱讀 34%</span><span class="chip">改寫 9%</span><span class="chip">翻譯 9%</span></div>
    <div class="meta" style="margin-top:10px"><span>47 題・滿分 100</span><span>${unlocked ? mb : "L3、L4、R2 各完成 3 個小單元即可解鎖"}</span></div>
  </button>`;
  $app.innerHTML = `
    <div class="hero"><div class="deco">ABC</div>
      <h1>八年級英文 第二次段考強化練習</h1>
      <div class="sub">範圍：Lesson 3・Lesson 4・Review 2</div>
      <div class="sub">特色：課文闖關｜每課 5～6 個小單元，答對得 ★ 與 XP，三課達標解鎖模擬段考</div>
      <div class="sub pe-level"></div>
      <div class="stats">
        <div class="stat"><b>★ ${st}</b>/ ${max}</div>
        <div class="stat"><b>${P.xp}</b>XP</div>
        <div class="stat"><span class="rank">${rankOf(st)}</span></div>
      </div>
    </div>
    <details class="pe-howto" open><summary>📌 怎麼用：課前預習・課後複習・自主練習・段考衝刺</summary><ul><li><b>📖 課前預習：</b>上新課前，先做該課的「單字闖關」，熟悉新單字。</li><li><b>✍️ 課後複習：</b>上完一課，做該課的文法單元（L3 時間說法、when / before / after；L4 不定詞、動名詞）。</li><li><b>🎯 自主練習：</b>到 Review 2 混合練習時態、改寫與閱讀；做完先看「錯題詳解」，再按「錯題重練」只重做答錯的題目。</li><li><b>🏆 段考衝刺：</b>三課各完成 3 個小單元後，挑戰模擬段考（47 題・滿分 100）。</li></ul></details>
    <div class="grid">${cards}</div>
    <div class="howto"><b>闖關規則</b>　每個小單元依答對率得星：60% ★、70% ★★、80% ★★★、90% ★★★★、全對 ★★★★★。模擬段考的成績就是本頁的「練習等級」；「錯題重練」可以反覆訂正，但不計入星星與練習等級。答對 +10 XP，連續答對還有 🔥 連擊加分；文意字彙用了 💡 提示只拿 +5 XP。三課都完成 3 個小單元後，就能挑戰 🏆 模擬段考！</div>
    <footer>八年級英文 第二次段考 L3–L4・R2 練習</footer>`;
  scrollTo(0, 0);
}
function lockedMsg() { alertBox("🔒 模擬段考尚未解鎖", "L3、L4、R2 每一課都至少要在 3 個小單元拿到 ★，才能挑戰模擬段考。加油！"); }
function alertBox(t, m) {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:9;padding:16px";
  d.innerHTML = `<div style="background:#fff;border-radius:18px;padding:22px;max-width:420px;text-align:center"><div style="font-weight:800;font-size:20px">${t}</div><p>${m}</p><button class="btn">知道了</button></div>`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}

/* ================= 課次頁 ================= */
function showLesson(id) {
  Q = null;
  const L = LESSONS.find(x => x.id === id);
  setTheme(L.color, L.soft);
  const us = L.units.map((u, i) => {
    const r = P.units[u.id] || {};
    return `<button class="ucard" onclick="startUnit('${L.id}','${u.id}')">
      <div class="no">${u.icon}</div>
      <div><div class="t">${i + 1}. ${u.title}</div><div class="d">${u.desc}</div>
      <div class="s">${starHTML(r.stars || 0)}　${u.qs.length} 題${r.best != null ? "・最佳 " + Math.round(r.best * 100) + "%" : ""}</div></div>
    </button>`;
  }).join("");
  const s = lessonStars(L), m = L.units.length * 5;
  $app.innerHTML = `
    <div class="topbar"><button class="back" onclick="showHome()">← 回首頁</button><span class="pill">★ ${s} / ${m}</span>${s === m ? `<span class="pill">🎖️ ${L.badge}</span>` : ""}</div>
    <div class="banner" style="background:linear-gradient(135deg,#3f2a8c,#6741d9)"><div class="big">${L.icon}</div>
      <h2>${L.title}</h2><div class="en">${L.en}</div>
      <div class="pts">${L.points.map(p => `<span class="chip">${p}</span>`).join("")}</div></div>
    <div class="units">${us}</div>`;
  scrollTo(0, 0);
}

/* ================= 建立測驗 ================= */
function prep(q) {
  const o = Object.assign({}, q);
  if (o.t === "mc") {
    const raw = o.opts.map(s => ({ txt: s.replace(/^\*/, ""), ok: s[0] === "*" }));
    const sh = shuffle(raw);
    o.o = sh.map(x => x.txt); o.ci = sh.findIndex(x => x.ok);
  } else if (o.t === "or") {
    o.tok = tokensOf(o.en);
    o.order = shuffleNot(o.tok.map((_, i) => i));
  } else if (o.t === "sq") {
    o.order = shuffleNot(o.items.map((_, i) => i));
  }
  return o;
}
function shuffleNot(idx) { let s; let n = 0; do { s = shuffle(idx); n++; } while (idx.length > 1 && s.every((v, i) => v === i) && n < 20); return s; }

function startUnit(lid, uid) {
  const L = LESSONS.find(x => x.id === lid), U = L.units.find(x => x.id === uid);
  setTheme(L.color, L.soft);
  const singles = U.qs.filter(q => !q.psg), grouped = U.qs.filter(q => q.psg);
  const items = shuffle(singles).concat(grouped).map(prep);
  Q = { mode: "practice", L, U, title: `${L.title}｜${U.title}`, items, i: 0, ans: items.map(() => null), res: items.map(() => null), xp: 0, combo: 0, best: 0, hint: {}, psgOpen: true };
  renderQ();
}
function startMock() {
  setTheme(MOCK.color, MOCK.soft);
  const items = [];
  MOCK.sections.forEach((s, si) => s.qs.forEach(q => { const o = prep(q); o.sec = si; o.pts = s.pts; items.push(o); }));
  Q = { mode: "exam", L: MOCK, title: "🏆 模擬段考", items, i: 0, ans: items.map(() => null), res: items.map(() => null), xp: 0, combo: 0, best: 0, hint: {}, psgOpen: true };
  renderQ();
}

/* ================= 判斷對錯 ================= */
function isRight(q, a) {
  if (a == null) return false;
  switch (q.t) {
    case "mc": return a === q.ci;
    case "sp": return norm(a[0]) === norm(q.q.match(/\[(.+?)\]/)[1]);
    case "fi": return q.ans.every((x, k) => alts(x).some(v => norm(v) === norm(a[k])));
    case "rw": return q.ans.some(v => norm(v) === norm(a[0]));
    case "or": { const g = norm(a.map(k => q.tok[k]).join(" ")); return a.length === q.tok.length && [q.en].concat(q.alts).some(v => norm(v) === g); }
    case "sq": return a.length === q.items.length && a.every((v, k) => v === k);
  }
  return false;
}
function corrText(q) {
  switch (q.t) {
    case "mc": return `(${"ABCD"[q.ci]}) ${q.o[q.ci]}`;
    case "sp": return q.q.match(/\[(.+?)\]/)[1];
    case "fi": return q.ans.map(x => alts(x).join(" / ")).join("　｜　");
    case "rw": return q.ans[0] + (q.ans.length > 1 ? `<br><span style="font-weight:400;font-size:15px">也可以：${q.ans.slice(1).join("　/　")}</span>` : "");
    case "or": return q.en + (q.alts.length ? `<br><span style="font-weight:400;font-size:15px">也可以：${q.alts.join("　/　")}</span>` : "");
    case "sq": return q.items.map((x, k) => `${k + 1}. ${x}`).join("<br>");
  }
}
function givenText(q, a) {
  if (a == null) return "（未作答）";
  switch (q.t) {
    case "mc": return `(${"ABCD"[a]}) ${q.o[a]}`;
    case "sp": case "rw": return esc(a[0] || "（空白）");
    case "fi": return a.map(x => esc(x || "＿")).join("　｜　");
    case "or": return esc(a.map(k => q.tok[k]).join(" ")) || "（空白）";
    case "sq": return a.map(k => q.items[k]).join(" → ");
  }
}
function stemText(q) {
  if (q.t === "or") return q.zh;
  if (q.t === "sq") return `【${q.psg.title}】${q.q}`;
  if (q.psg) return `【${q.psg.title}】${q.b ? "空格 " + q.b : strip(q.q)}`;
  if (q.t === "sp") return strip(q.q.replace(/\[(.+?)\]/, (m, w) => w[0] + "＿".repeat(Math.max(w.length - 2, 1)) + w.slice(-1)));
  if (q.t === "rw") return strip(q.q) + `（${q.hint}）`;
  return strip(q.q).replace(/___/g, "＿＿");
}

/* ================= 作答畫面 ================= */
function renderQ() {
  const q = Q.items[Q.i], n = Q.items.length, done = Q.res[Q.i] != null, exam = Q.mode === "exam";
  const a = Q.ans[Q.i];
  const correct = Q.res.filter(r => r && r.ok).length;
  let head = `<div class="qhead"><button class="back" onclick="quitQ()">✕</button><div class="name">${Q.title}</div>
    <span class="pill">${Q.i + 1} / ${n}</span>`;
  if (exam) head += `<span class="pill">${MOCK.sections[q.sec].name}（每題 ${q.pts} 分）</span>`;
  else head += `<span class="pill">✔ ${correct}</span><span class="pill">${Q.xp} XP</span>${Q.combo >= 2 ? `<span class="pill combo">🔥 ${Q.combo} 連擊</span>` : ""}`;
  head += `</div><div class="prog"><i style="width:${(exam ? Q.ans.filter(x => x != null).length : Q.res.filter(Boolean).length) / n * 100}%"></i></div>`;

  let psg = "";
  if (q.psg) {
    const body = q.psg.html.replace(/\{(\d+)\}/g, (m, b) => `<span class="bl ${+b === q.b ? "cur" : ""}">${b}</span>`);
    psg = `<div class="psg"><div class="ph"><span>${q.psg.kind === "cloze" ? "📝 克漏字" : "📖 閱讀"}　<b>${q.psg.title}</b></span><button class="tog" onclick="Q.psgOpen=!Q.psgOpen;renderQ()">${Q.psgOpen ? "收合文章 ▲" : "展開文章 ▼"}</button></div>
      <div class="body ${Q.psgOpen ? "" : "hidden"}">${body}${q.psg.notes ? `<div class="notes">${q.psg.notes}</div>` : ""}</div></div>`;
  }

  let card = `<div class="qcard"><span class="tag">${q.tag || tagOf(q)}</span>`;
  if (q.clk) card += clockSVG(q.clk[0], q.clk[1]);
  const lock = done && !exam;

  if (q.t === "mc") {
    card += `<div class="stem">${q.b ? `請選出文章中 <span class="bl cur">${q.b}</span> 的最佳答案。` : q.q}</div><div class="opts">`;
    q.o.forEach((t, k) => {
      let cls = "";
      if (lock) { if (k === q.ci) cls = "right"; else if (k === a) cls = "wrong"; }
      else if (a === k) cls = "sel";
      card += `<button class="opt ${cls}" ${lock ? "disabled" : ""} onclick="pick(${k})"><span class="k">${"ABCD"[k]}</span><span>${t}</span></button>`;
    });
    card += `</div>`;
  } else if (q.t === "sp") {
    const w = q.q.match(/\[(.+?)\]/)[1], pat = w[0] + " " + "_ ".repeat(Math.max(w.length - 2, 1)) + w.slice(-1);
    const cls = lock ? (Q.res[Q.i].ok ? "right" : "wrong") : "";
    const inp = `<input class="inp ${cls}" id="in0" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${pat}" value="${esc(a ? a[0] : "")}" style="width:${Math.max(w.length * 15 + 40, 120)}px" ${lock ? "disabled" : ""}>`;
    card += `<div class="stem">${q.q.replace(/\[(.+?)\]/, inp)}</div>
      <div class="hint2">字首字尾提示：<b style="font-family:var(--en)">${pat}</b>（共 ${w.length} 個字母）
      ${exam ? "" : Q.hint[Q.i] ? `　💡 中文：<b>${q.zh}</b>` : (lock ? "" : `　<button class="btn ghost small" onclick="useHint()">💡 看中文提示</button>`)}</div>`;
  } else if (q.t === "fi") {
    let k = -1;
    const st = q.q.replace(/___/g, () => { k++; const len = Math.max(...alts(q.ans[k]).map(s => s.length)); const ok = lock ? alts(q.ans[k]).some(v => norm(v) === norm(a && a[k])) : null;
      return `<input class="inp ${lock ? (ok ? "right" : "wrong") : ""}" id="in${k}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(a && a[k] != null ? a[k] : "")}" style="width:${Math.max(len * 14 + 34, 90)}px" ${lock ? "disabled" : ""}>`; });
    card += `<div class="stem">${st}</div>`;
  } else if (q.t === "rw") {
    card += `<div class="stem"><div class="orig">${q.q}</div><div class="hint2">✏️ 提示：<b>${q.hint}</b>　（請寫出完整句子）</div></div>
      <input class="inp long ${lock ? (Q.res[Q.i].ok ? "right" : "wrong") : ""}" id="in0" autocomplete="off" spellcheck="false" placeholder="在這裡輸入完整的英文句子" value="${esc(a ? a[0] : "")}" ${lock ? "disabled" : ""}>`;
  } else if (q.t === "or" || q.t === "sq") {
    const blk = q.t === "sq", picked = a || [], src = blk ? q.items : q.tok;
    card += blk ? `<div class="stem">${q.q}</div>` : `<div class="zh">${q.zh}</div><div class="hint2">把字卡排成正確的英文句子（標點符號已省略）</div>`;
    card += `<div class="ans-area ${blk ? "blk" : ""} ${picked.length ? "" : "empty"}">${picked.map((k, j) => `<button class="wc ${blk ? "blk" : ""}" ${lock ? "disabled" : ""} onclick="untap(${j})">${blk ? `<span class="n">${j + 1}</span>` : ""}${esc(src[k])}</button>`).join("")}</div>
      <div class="bank ${blk ? "blk" : ""}">${q.order.map(k => `<button class="wc ${blk ? "blk" : ""} ${picked.includes(k) ? "used" : ""}" ${lock ? "disabled" : ""} onclick="tap(${k})">${esc(src[k])}</button>`).join("")}</div>`;
  }

  // 按鈕與回饋
  let tools = "";
  if (exam) {
    tools = `<div class="tools"><button class="btn ghost" ${Q.i === 0 ? "disabled" : ""} onclick="move(-1)">← 上一題</button>
      ${(q.t === "or" || q.t === "sq") ? `<button class="btn ghost" onclick="resetOrder()">↺ 重排</button>` : ""}
      ${Q.i < n - 1 ? `<button class="btn" onclick="move(1)">下一題 →</button>` : ""}
      <button class="btn" style="background:#b07800" onclick="submitExam()">📮 交卷</button></div>
      <div class="navx">${Q.items.map((_, k) => `<button class="${k === Q.i ? "cur" : (Q.ans[k] != null && (Q.ans[k].length === undefined || Q.ans[k].length)) ? "done" : ""}" onclick="jump(${k})">${k + 1}</button>`).join("")}</div>`;
  } else if (!done) {
    tools = `<div class="tools">${q.t !== "mc" ? `<button class="btn" onclick="check()">檢查答案 ✔</button>` : ""}
      ${(q.t === "or" || q.t === "sq") ? `<button class="btn ghost" onclick="resetOrder()">↺ 重排</button>` : ""}</div>`;
  } else {
    const r = Q.res[Q.i];
    tools = `<div class="fb ${r.ok ? "ok" : "no"}"><div class="h">${r.ok ? "✔ 答對了！" + (r.gain ? ` +${r.gain} XP` : "") : "✘ 再想想！正確答案是："}</div>
      ${r.ok ? "" : `<div class="ca">${corrText(q)}</div>`}
      <div class="ex">💬 ${q.exp}</div></div>
      <div class="tools"><button class="btn" id="nextBtn" onclick="nextQ()">${Q.i < n - 1 ? "下一題 →" : "看結果 🏁"}</button></div>`;
  }
  card += tools + `</div>`;
  $app.innerHTML = head + psg + card;
  bindInputs();
}
function tagOf(q) { return { mc: "選擇題", sp: "文意字彙", fi: "填空", rw: "依提示改寫", or: "整句翻譯", sq: "事件排序" }[q.t]; }

function bindInputs() {
  const ins = $app.querySelectorAll("input.inp:not([disabled])");
  ins.forEach((el, k) => {
    el.addEventListener("input", saveInputs);
    el.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (k < ins.length - 1) ins[k + 1].focus();
      else if (Q.mode === "exam") move(1); else check();
    });
  });
  if (ins.length && matchMedia("(pointer:fine)").matches) { const f = [...ins].find(x => !x.value) || ins[0]; f.focus(); }
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus();
}
function saveInputs() {
  const ins = $app.querySelectorAll("input.inp");
  const v = [...ins].map(x => x.value);
  Q.ans[Q.i] = v.some(x => x.trim()) ? v : null;
}

/* ---------- 互動 ---------- */
function pick(k) {
  if (Q.mode === "exam") { Q.ans[Q.i] = k; renderQ(); return; }
  if (Q.res[Q.i]) return;
  Q.ans[Q.i] = k; check();
}
function tap(k) { const a = Q.ans[Q.i] || []; if (!a.includes(k)) a.push(k); Q.ans[Q.i] = a; renderQ(); }
function untap(j) { const a = Q.ans[Q.i] || []; a.splice(j, 1); Q.ans[Q.i] = a.length ? a : null; renderQ(); }
function resetOrder() { Q.ans[Q.i] = null; renderQ(); }
function useHint() { saveInputs(); Q.hint[Q.i] = true; renderQ(); }
function check() {
  const q = Q.items[Q.i];
  if (q.t === "sp" || q.t === "fi" || q.t === "rw") saveInputs();
  const a = Q.ans[Q.i];
  if (a == null) { flash("先作答再檢查喔！", "#a04d00"); return; }
  if ((q.t === "or" || q.t === "sq") && a.length < (q.tok || q.items).length) { flash("還有字卡沒有用完喔！", "#a04d00"); return; }
  const ok = isRight(q, a);
  let gain = 0;
  if (ok) { Q.combo++; gain = (Q.hint[Q.i] ? 5 : 10) + (Q.combo >= 3 ? Math.min(Q.combo - 2, 5) * 2 : 0); Q.xp += gain; Q.best = Math.max(Q.best, Q.combo); flash("+" + gain + " XP", null); }
  else Q.combo = 0;
  Q.res[Q.i] = { ok, gain };
  renderQ();
}
function flash(t, color) { const d = document.createElement("div"); d.className = "xp-pop"; d.textContent = t; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
function nextQ() { if (Q.i < Q.items.length - 1) { Q.i++; renderQ(); scrollTop(); } else if (Q.mode === "retry") finishRetry(); else finishPractice(); }
function move(d) { saveIfText(); Q.i = Math.min(Math.max(Q.i + d, 0), Q.items.length - 1); renderQ(); scrollTop(); }
function jump(k) { saveIfText(); Q.i = k; renderQ(); scrollTop(); }
function saveIfText() { const t = Q.items[Q.i].t; if (t === "sp" || t === "fi" || t === "rw") saveInputs(); }
function scrollTop() { scrollTo({ top: 0, behavior: "smooth" }); }
function quitQ() {
  const started = Q.ans.some(x => x != null);
  if (started && !confirmBox()) return;
  if (Q.mode === "exam" || !Q.U) showHome(); else showLesson(Q.L.id);
}
function confirmBox() { return window.confirm("確定要離開嗎？這次的作答不會記錄。"); }

/* ================= 結果 ================= */
function reviewHTML(onlyWrong) {
  return Q.items.map((q, k) => {
    const ok = Q.res[k] && Q.res[k].ok;
    if (onlyWrong && ok) return "";
    return `<div class="ritem ${ok ? "okk" : ""}"><div class="rq"><b>${k + 1}.</b> ${stemText(q)}</div>
      ${ok ? "" : `<div class="ry">你的答案：${givenText(q, Q.ans[k])}</div>`}
      <div class="rc">${ok ? "✔ " : "正解："}${corrText(q)}</div><div class="re">💬 ${q.exp}</div></div>`;
  }).join("");
}
function finishPractice() {
  const n = Q.items.length, c = Q.res.filter(r => r && r.ok).length, pct = c / n, st = starsOf(pct);
  const prev = P.units[Q.U.id] || {};
  const newBest = st > (prev.stars || 0);
  P.units[Q.U.id] = { stars: Math.max(st, prev.stars || 0), best: Math.max(pct, prev.best || 0) };
  P.xp += Q.xp; saveP();
  const idx = Q.L.units.findIndex(u => u.id === Q.U.id), nu = Q.L.units[idx + 1];
  const msg = st === 5 ? "太強了！全對五顆星 🎉" : st >= 3 ? "很不錯！再挑戰拿五顆星吧！" : st >= 1 ? "有星星了！把錯題看一遍再挑戰。" : "別灰心，看完詳解再試一次！";
  const wrong = n - c;
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showLesson('${Q.L.id}')">← 回 ${Q.L.title}</button></div>
    <div class="result"><div class="bigstars">${starHTML(st).replace('class="stars"', "")}</div>
      <h2>${Q.U.icon} ${Q.U.title}</h2><div class="score">${c} / ${n}</div>
      <div>${msg}${newBest ? "　<b>（新紀錄！）</b>" : ""}</div>
      <div style="margin-top:8px;color:var(--muted)">本次獲得 <b>${Q.xp} XP</b>・最高連擊 🔥 ${Q.best}</div>
      <div class="tools" style="justify-content:center">
        <button class="btn" onclick="startUnit('${Q.L.id}','${Q.U.id}')">↻ 再挑戰一次</button>
        ${retryBtn()}
        ${nu ? `<button class="btn ghost" onclick="startUnit('${Q.L.id}','${nu.id}')">下一單元：${nu.title} →</button>` : `<button class="btn ghost" onclick="showHome()">← 回首頁</button>`}
      </div></div>
    <div class="review"><h3>${wrong ? `📌 錯題詳解（${wrong} 題）` : "📌 全部答對！以下是本單元詳解"}</h3>${reviewHTML(wrong > 0)}</div>`;
  scrollTo(0, 0);
}
/* ---------- 錯題重練：只重做答錯的題目，成績不計入星星、最佳成績與練習等級 ---------- */
function wrongIdx(src) { return src.items.map((q, k) => (src.res[k] && src.res[k].ok) ? -1 : k).filter(k => k >= 0); }
function retryBtn() { const n = wrongIdx(Q).length; return n ? `<button class="btn" style="background:#c43c2f" onclick="startRetry()">🔁 錯題重練（${n} 題）</button>` : ""; }
function startRetry() {
  const src = Q, items = wrongIdx(src).map(k => prep(src.items[k]));
  if (!items.length) return;
  if (src.L.color) setTheme(src.L.color, src.L.soft);
  Q = { mode: "retry", L: src.L, U: src.U, title: `🔁 錯題重練｜${src.U ? src.L.title + "・" + src.U.title : "模擬段考"}`, items, i: 0, ans: items.map(() => null), res: items.map(() => null), xp: 0, combo: 0, best: 0, hint: {}, psgOpen: true };
  renderQ(); scrollTo(0, 0);
}
function finishRetry() {
  const n = Q.items.length, c = Q.res.filter(r => r && r.ok).length, left = n - c;
  P.xp += Q.xp; saveP();
  const back = Q.U ? `<button class="back" onclick="showLesson('${Q.L.id}')">← 回 ${Q.L.title}</button>` : `<button class="back" onclick="showHome()">← 回首頁</button>`;
  const again = Q.U ? `<button class="btn ghost" onclick="startUnit('${Q.L.id}','${Q.U.id}')">↻ 整個單元再挑戰</button>` : `<button class="btn ghost" onclick="startMock()">↻ 模擬段考重新作答</button>`;
  $app.innerHTML = `<div class="topbar">${back}</div>
    <div class="result"><div style="font-size:52px">${left ? "🔁" : "🎉"}</div><h2>錯題重練完成</h2>
      <div class="score">${c} / ${n}</div>
      <div>${left ? `還有 ${left} 題沒弄懂，看完錯題詳解再練一次！` : "錯題全部訂正完成，太棒了！"}</div>
      <div style="margin-top:8px;color:var(--muted)">本次獲得 <b>${Q.xp} XP</b>・錯題重練不計入星星與練習等級</div>
      <div class="tools" style="justify-content:center">${retryBtn()}${again}</div></div>
    ${left ? `<div class="review"><h3>📌 錯題詳解（${left} 題）</h3>${reviewHTML(true)}</div>` : ""}`;
  scrollTo(0, 0);
}
function submitExam() {
  saveIfText();
  const blank = Q.ans.filter(x => x == null || (Array.isArray(x) && !x.length)).length;
  if (blank && !window.confirm(`還有 ${blank} 題沒有作答，確定要交卷嗎？`)) return;
  let score = 0; const secs = MOCK.sections.map(s => ({ name: s.name, c: 0, n: 0, pts: 0, max: 0 }));
  Q.items.forEach((q, k) => { const ok = isRight(q, Q.ans[k]); Q.res[k] = { ok }; const s = secs[q.sec]; s.n++; s.max += q.pts; if (ok) { s.c++; s.pts += q.pts; score += q.pts; } });
  const first = P.mock == null;
  P.mock = Math.max(P.mock || 0, score); P.xp += score; saveP();
  PE115.report(score);
  const lv = PE115.label(score);
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showHome()">← 回首頁</button></div>
    <div class="result"><div style="font-size:52px">🏆</div><h2>模擬段考成績</h2>
      <div class="score">${score} 分</div><div><b>${lv}</b>${!first && score >= P.mock ? "　（最佳紀錄）" : ""}</div>
      <div class="secs">${secs.map(s => `<div class="sec">${s.name}<b>${s.pts} / ${s.max} 分</b>答對 ${s.c} / ${s.n}</div>`).join("")}</div>
      <div class="tools" style="justify-content:center"><button class="btn" onclick="startMock()">↻ 重新作答</button>${retryBtn()}<button class="btn ghost" onclick="showHome()">← 回首頁</button></div></div>
    <div class="review"><h3>📌 錯題詳解（${Q.res.filter(r => !r.ok).length} 題）</h3>${reviewHTML(true)}</div>`;
  scrollTo(0, 0);
}

showHome();

</script>

<script id="pe115-map">
/* ===== PE115 島嶼地圖元件（各練習頁共用，內容一字不差；各頁設定寫在 pe115-map-config） =====
   用法：PE115Map.add({ key, anchor, items, hide, name, sub, kind, color, locked, apart })
   - 把頁面原本的課次／單元卡片畫成 2.5D 島嶼地圖：每張卡片一座島，依序用橋相連
   - 點島嶼 → 跳出原本那張卡片（點卡片上的按鈕才真正進入，避免誤按）
   - 右上可切換「📋 清單」回到原本的卡片排列；選擇記在 localStorage「pe115:view」（與入口網站共用）
   - 頁面重新畫面時會自動重建，不需要改各頁原本的程式 */
(function () {
  if (window.PE115Map) return;
  const VIEW_KEY = 'pe115:view';
  const getView = () => { try { return localStorage.getItem(VIEW_KEY) || 'map'; } catch (e) { return 'map'; } };
  const setView = v => { try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} };
  const CONFIGS = [];
  const SEL = {};

  /* ---------- 繪圖小工具 ---------- */
  function shade(hex, t) {
    const n = parseInt(hex.slice(1), 16), f = t < 0 ? 0 : 255, k = Math.abs(t);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (f - v) * k));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
  }
  const f1 = v => Math.round(v * 10) / 10;
  const pts = a => a.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
  const poly = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
  const ISO = (x, y, u, v, z = 0) => [x + (u - v) * 0.866, y + (u + v) * 0.5 - z];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function box(x, y, w, d, h, col, z0 = 0, top) {
    const a = w / 2, b = d / 2, G = (u, v, z) => ISO(x, y, u, v, z);
    return poly([G(-a, b, z0), G(a, b, z0), G(a, b, z0 + h), G(-a, b, z0 + h)], col) +
      poly([G(a, -b, z0), G(a, b, z0), G(a, b, z0 + h), G(a, -b, z0 + h)], shade(col, -0.22)) +
      poly([G(-a, -b, z0 + h), G(a, -b, z0 + h), G(a, b, z0 + h), G(-a, b, z0 + h)], top || shade(col, 0.18));
  }
  function roof(x, y, w, d, z0, rh, col) {
    const a = w / 2, b = d / 2, G = (u, v, z) => ISO(x, y, u, v, z), T = G(0, 0, z0 + rh);
    return poly([G(-a, -b, z0), G(a, -b, z0), T], shade(col, 0.25)) + poly([G(-a, -b, z0), G(-a, b, z0), T], shade(col, 0.1)) +
      poly([G(a, -b, z0), G(a, b, z0), T], shade(col, -0.25)) + poly([G(-a, b, z0), G(a, b, z0), T], col);
  }
  const onLeft = (x, y, w, d, z0, inner) => { const o = ISO(x, y, -w / 2, d / 2, z0); return `<g transform="matrix(0.866,0.5,0,1,${f1(o[0])},${f1(o[1])})">${inner}</g>`; };
  const onRight = (x, y, w, d, z0, inner) => { const o = ISO(x, y, w / 2, d / 2, z0); return `<g transform="matrix(0.866,-0.5,0,1,${f1(o[0])},${f1(o[1])})">${inner}</g>`; };
  function cyl(x, y, r, h, col, z0 = 0) {
    const ry = r * 0.5, yb = y - z0, yt = yb - h;
    return `<path d="M${f1(x - r)},${f1(yt)}L${f1(x - r)},${f1(yb)}A${r} ${ry} 0 0 0 ${f1(x + r)},${f1(yb)}L${f1(x + r)},${f1(yt)}Z" fill="${col}"/>` +
      `<path d="M${f1(x + r * 0.15)},${f1(yt)}L${f1(x + r * 0.15)},${f1(yb + ry * 0.99)}A${r} ${ry} 0 0 0 ${f1(x + r)},${f1(yb)}L${f1(x + r)},${f1(yt)}Z" fill="${shade(col, -0.2)}"/>` +
      `<ellipse cx="${f1(x)}" cy="${f1(yt)}" rx="${r}" ry="${f1(ry)}" fill="${shade(col, 0.2)}"/>`;
  }
  function cone(x, y, r, h, col, z0 = 0) {
    const yb = y - z0;
    return poly([[x - r, yb], [x, yb - h], [x, yb + r * 0.35]], shade(col, 0.12)) + poly([[x, yb + r * 0.35], [x, yb - h], [x + r, yb]], shade(col, -0.18));
  }
  const shadow = (x, y, rx) => `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(rx * 0.45)}" fill="rgba(30,60,40,.18)"/>`;
  function tree(x, y, s = 1, col = '#5fa35a') {
    return shadow(x + 3, y, 9 * s) + `<rect x="${f1(x - 1.6 * s)}" y="${f1(y - 9 * s)}" width="${f1(3.2 * s)}" height="${f1(9 * s)}" fill="#8b5e3c"/>` +
      `<circle cx="${f1(x)}" cy="${f1(y - 15 * s)}" r="${f1(9 * s)}" fill="${col}"/>` +
      `<circle cx="${f1(x + 2.5 * s)}" cy="${f1(y - 13 * s)}" r="${f1(6.5 * s)}" fill="${shade(col, -0.15)}"/>` +
      `<circle cx="${f1(x - 3 * s)}" cy="${f1(y - 18 * s)}" r="${f1(4.5 * s)}" fill="${shade(col, 0.2)}"/>`;
  }
  const pine = (x, y, s = 1, col = '#3f8f5a') => shadow(x + 2, y, 7 * s) + `<rect x="${f1(x - 1.3 * s)}" y="${f1(y - 6 * s)}" width="${f1(2.6 * s)}" height="${f1(6 * s)}" fill="#7a4f2e"/>` + cone(x, y - 5 * s, 8 * s, 24 * s, col);
  const SHIRTS = ['#f08c00', '#1c7ed6', '#e64980', '#37b24d', '#7950f2', '#fab005', '#f8f9fa'];
  function person(x, y, i) {
    const c = SHIRTS[i % SHIRTS.length];
    return `<ellipse cx="${f1(x + 1)}" cy="${f1(y)}" rx="4" ry="1.8" fill="rgba(0,0,0,.18)"/><rect x="${f1(x - 2.6)}" y="${f1(y - 10)}" width="5.2" height="9" rx="2" fill="${c}"/>` +
      `<circle cx="${f1(x)}" cy="${f1(y - 12.6)}" r="2.8" fill="#f3c89b"/><path d="M${f1(x - 2.9)},${f1(y - 13)}a2.9 2.9 0 0 1 5.8 0z" fill="#3b2a20"/>`;
  }
  const flag = (x, y, col, h = 26) => `<line x1="${x}" y1="${y}" x2="${x}" y2="${y - h}" stroke="#6b6b6b" stroke-width="1.6"/>` + poly([[x, y - h], [x + 14, y - h + 4], [x, y - h + 9]], col);
  const line = (a, b, col, w = 1.5, extra = '') => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${col}" stroke-width="${w}" ${extra}/>`;
  const bird = (x, y, col = '#495057', s = 1) => `<path d="M${f1(x - 6 * s)},${f1(y)}q${f1(3 * s)},${f1(-4 * s)} ${f1(6 * s)},0q${f1(3 * s)},${f1(-4 * s)} ${f1(6 * s)},0" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`;
  /* 立體符號紀念碑（√、×）：粗線＋暗色側影＋底座 */
  const monument = (x, y, d, col, w = 7, px = 0, pw = 60) => shadow(px + 6, 6, pw / 2) + box(px, 2, pw, 20, 8, '#ced4da') +
    `<path d="${d}" transform="translate(${x + 2},${y + 2})" fill="none" stroke="${shade(col, -0.35)}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" transform="translate(${x},${y})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  function pavilion(x, y, c, s = 1) {
    const G = (u, v) => ISO(x, y, u * s, v * s); let o = shadow(x + 6 * s, y + 6 * s, 34 * s) + box(x, y, 54 * s, 54 * s, 6 * s, '#d9ccb4');
    [[-21, -21], [21, -21], [-21, 21], [21, 21]].forEach(([u, v]) => { const p = G(u, v); o += box(p[0], p[1], 4 * s, 4 * s, 30 * s, '#c92a2a', 6 * s); });
    return o + box(x, y, 54 * s, 54 * s, 4 * s, c, 34 * s) + roof(x, y, 72 * s, 72 * s, 38 * s, 26 * s, '#3d4558') + `<circle cx="${f1(x)}" cy="${f1(y - 66 * s)}" r="${f1(3.5 * s)}" fill="#f59f00"/>`;
  }
  function turbine(x, y, anim) {
    const hy = y - 48, blades = [0, 120, 240].map(a => `<path d="M${x},${hy} l-1.6,-20 l1.6,-2 l1.6,2z" fill="#f8f9fa" transform="rotate(${a} ${x} ${hy})"/>`).join('');
    return shadow(x + 2, y, 5) + `<line x1="${x}" y1="${y}" x2="${x}" y2="${hy}" stroke="#e9ecef" stroke-width="3"/>` +
      `<g>${blades}${anim ? `<animateTransform attributeName="transform" type="rotate" from="0 ${x} ${hy}" to="360 ${x} ${hy}" dur="6s" repeatCount="indefinite"/>` : ''}</g><circle cx="${x}" cy="${hy}" r="2.6" fill="#adb5bd"/>`;
  }

  /* ---------- 地標庫：kind 名稱 → 建築 ---------- */
  const L = {
    pavilion: c => { let s = ''; [[-62, -14], [-54, -24], [-70, -4]].forEach(([x, y], i) => { s += `<rect x="${x}" y="${y - 40}" width="3" height="40" fill="${i % 2 ? '#74b85a' : '#5c9f45'}"/><ellipse cx="${x + 5}" cy="${y - 36}" rx="7" ry="3" fill="#78c25e"/>`; });
      return s + tree(58, -20, 1.1) + tree(70, 4, 0.9, '#6ab04c') + pavilion(-8, -14, c) + shadow(42, 26, 18) + box(34, 22, 16, 22, 3, '#f8f3e6', 0, '#fff') + box(50, 22, 16, 22, 3, '#efe6d0', 0, '#fbf7ee') + person(-40, 18, 0) + person(10, 30, 3); },
    lotus: c => { let s = `<ellipse cx="-14" cy="10" rx="54" ry="24" fill="#74c0fc"/><ellipse cx="-14" cy="10" rx="46" ry="19" fill="#a5d8ff"/>`;
      [[-40, 4], [-22, 18], [-2, 6], [-30, 14], [8, 16], [-50, 14], [-12, -2]].forEach(([x, y], i) => { s += `<ellipse cx="${x}" cy="${y}" rx="7" ry="3" fill="${i % 2 ? '#51cf66' : '#69db7c'}"/>`; if (i % 2 === 0) s += `<path d="M${x - 3},${y - 1}q3,-9 6,0z" fill="#f783ac"/><path d="M${x - 5},${y - 1}q2,-5 5,-1q3,-4 5,1z" fill="#faa2c1"/>`; });
      return s + pavilion(46, -20, c, 0.62) + tree(-62, -20, 0.9) + pine(70, 10, 0.8) + person(30, 30, 2); },
    hourglass: c => { let s = shadow(-22, -2, 22) + box(-22, -6, 30, 30, 4, '#8d6e4f') + box(-22, -6, 30, 30, 4, '#8d6e4f', 52);
      s += poly([[-36, -14], [-8, -14], [-22, -34]], '#ffe8a3') + poly([[-36, -54], [-8, -54], [-22, -34]], '#fff3bf') + poly([[-31, -18], [-13, -18], [-22, -28]], '#f2c14e') + line([-22, -34], [-22, -18], '#f2c14e', 1.5);
      [[-35, -10], [-9, -10]].forEach(([x]) => { s += `<rect x="${x - 1.5}" y="-58" width="3" height="48" fill="#6d5137"/>`; });
      s += shadow(34, 12, 22) + `<path d="M14,10a20 12 0 0 0 40 0z" fill="#ffd8a8"/><path d="M14,10a20 16 0 0 1 40 -8" fill="none" stroke="#ffc078" stroke-width="5"/><circle cx="34" cy="4" r="7" fill="#fff"/><circle cx="32" cy="2" r="2.4" fill="#e7f5ff"/>`;
      [[0, 30], [12, 34], [24, 32], [-48, 22]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="3" fill="#f8f9fa" stroke="#dee2e6"/>`; });
      return s + tree(64, -18, 0.9) + pine(-66, 6, 0.8) + person(-40, 28, 4); },
    birdtree: c => { let s = shadow(-14, -4, 34) + `<rect x="-18" y="-46" width="8" height="42" fill="#8b5e3c"/><path d="M-14,-36 l26,-14" stroke="#8b5e3c" stroke-width="4"/>`;
      s += `<circle cx="-14" cy="-62" r="30" fill="#5fa35a"/><circle cx="-2" cy="-56" r="20" fill="#4f8f4a"/><circle cx="-26" cy="-72" r="14" fill="#7cc26e"/>`;
      s += line([12, -50], [12, -40], '#adb5bd', 1.2) + `<path d="M2,-16v-18a10 8 0 0 1 20 0v18z" fill="rgba(255,236,153,.35)" stroke="${c}" stroke-width="1.6"/>` + [6, 12, 18].map(x => line([x, -36], [x, -16], c, 1)).join('') + `<ellipse cx="12" cy="-16" rx="10" ry="3" fill="${c}"/><circle cx="12" cy="-24" r="3.5" fill="#fcc419"/><path d="M15,-24l3,1-3,1z" fill="#f76707"/>`;
      return s + bird(40, -70) + bird(56, -58, '#495057', 0.8) + bird(-60, -50, '#868e96', 0.7) + `<rect x="34" y="16" width="26" height="4" fill="#a0785a"/>` + tree(66, -6, 0.8) + person(-44, 24, 1) + person(46, 30, 5); },
    trophy: c => { let s = box(-26, 4, 26, 26, 14, shade(c, 0.2)) + box(26, 4, 26, 26, 10, shade(c, 0.35)) + box(0, 4, 26, 26, 24, c);
      const ty = 4 - 24 - 13;
      s += `<rect x="-6" y="${ty + 2}" width="12" height="5" fill="#e8a400"/><rect x="-2" y="${ty - 8}" width="4" height="10" fill="#f59f00"/><path d="M-12,${ty - 30}h24c0,14 -6,20 -12,22c-6,-2 -12,-8 -12,-22z" fill="#fcc419"/>` +
        `<path d="M-12,${ty - 27}c-8,0 -8,10 0,11M12,${ty - 27}c8,0 8,10 0,11" fill="none" stroke="#f59f00" stroke-width="2.4"/><path d="M-6,${ty - 26}c0,8 2,12 4,14" stroke="#fff3bf" stroke-width="2" fill="none"/>`;
      const r = rng(7); for (let i = 0; i < 14; i++) s += `<rect x="${f1(-60 + r() * 120)}" y="${f1(-70 + r() * 50)}" width="3" height="5" fill="${SHIRTS[i % SHIRTS.length]}" transform="rotate(${Math.round(r() * 90)} ${f1(-60 + r() * 120)} ${f1(-60)})"/>`;
      return s + flag(-60, -6, c) + flag(52, -14, c) + tree(-66, 20, 0.8) + person(-36, 32, 0) + person(40, 30, 2); },
    castle: c => { const st = '#6c6683'; let s = shadow(4, 6, 50) + box(0, -8, 56, 40, 40, st);
      s += onLeft(0, -8, 56, 40, 0, `<path d="M20,0v-16a8 8 0 0 1 16 0v16z" fill="#2b2540"/><rect x="8" y="-32" width="6" height="8" fill="#ffd43b"/><rect x="42" y="-32" width="6" height="8" fill="#ffd43b"/>`);
      for (let u = -24; u <= 24; u += 12) { const p = ISO(0, -8, u, 20); s += box(p[0], p[1], 6, 4, 6, shade(st, 0.1), 40); }
      [[-34, 4], [34, 4], [-34, -34], [34, -30]].forEach(([u, v], i) => { if (i > 1) return; const p = ISO(0, -8, u, v + 18); s += cyl(p[0], p[1], 11, 62, shade(st, -0.05)) + cone(p[0], p[1] - 62, 14, 26, c) + flag(p[0], p[1] - 88, '#f03e3e', 14); });
      s += `<circle cx="-10" cy="-78" r="4" fill="#ffd43b" opacity=".9"/><circle cx="10" cy="-78" r="4" fill="#ffd43b" opacity=".9"/><path d="M-22,-70q22,16 44,0" fill="none" stroke="${c}" stroke-width="3" opacity=".7"/>`;
      return s + pine(-70, 14, 0.8, '#2f6b4a') + pine(68, 18, 0.8, '#2f6b4a') + person(-10, 34, 4); },
    books: c => { let s = shadow(-6, 4, 42);
      [['#e03131', 0, 0], ['#1971c2', 12, 1], [c, 24, -1], ['#2b8a3e', 36, 0]].forEach(([col, z, dx]) => { s += box(-8 + dx * 3, -4, 58, 40, 11, col, z, '#f8f3e6') + onLeft(-8 + dx * 3, -4, 58, 40, z, `<rect x="2" y="-9" width="54" height="7" fill="#fffdf6"/>${[10, 20, 30, 40].map(v => `<line x1="${v}" y1="-9" x2="${v}" y2="-2" stroke="#e9e2cf" stroke-width="0.8"/>`).join('')}`); });
      s += `<path d="M-30,-58l22,-12l22,12l-22,10z" fill="#fff"/><line x1="-8" y1="-70" x2="-8" y2="-48" stroke="#dee2e6"/>`;
      return s + tree(60, -14, 0.9) + pine(-68, 0, 0.8) + person(40, 28, 3) + person(-44, 26, 6); },
    gate: c => { let s = `<ellipse cx="-44" cy="16" rx="26" ry="11" fill="#74c0fc"/><ellipse cx="-44" cy="16" rx="20" ry="7.5" fill="#a5d8ff"/><ellipse cx="-52" cy="14" rx="5" ry="2.2" fill="#69db7c"/><circle cx="-46" cy="12" r="2" fill="#f783ac"/>`;
      s += tree(62, -14, 1) + pine(-66, -10, 1);
      const x = 0, y = -16, G = (u, v) => ISO(x, y, u, v), A = G(-24, 0), B = G(24, 0);
      s += shadow(x + 6, y + 4, 34) + box(A[0], A[1], 8, 8, 44, '#b8b0a2') + box(B[0], B[1], 8, 8, 44, '#b8b0a2');
      s += box(x, y, 66, 10, 7, c, 28) + box(x, y, 72, 12, 6, shade(c, -0.15), 42) + roof(x, y, 80, 18, 48, 10, '#2f3b45');
      s += onLeft(x, y, 66, 10, 28, `<rect x="23" y="-7" width="20" height="6" rx="1" fill="#f8e7a8"/><text x="33" y="-2.4" font-size="5.2" text-anchor="middle" fill="${c}" font-weight="700">成語</text>`);
      [[30, 18], [42, 12], [54, 6]].forEach(([tx, ty]) => { s += box(tx, ty, 4, 12, 18, '#9aa0a6'); });
      return s + person(8, 26, 1) + person(-14, 32, 4); },
    pagoda: c => { let s = shadow(-4, -4, 30); const x = -4, y = -10; let z = 0;
      [34, 30, 26, 22, 18].forEach((w, i) => { s += box(x, y, w, w, 14, i % 2 ? '#f1e3c8' : '#e9d6b2', z) + roof(x, y, w + 14, w + 14, z + 14, 6, i % 2 ? shade(c, -0.1) : c); z += 20; });
      s += `<line x1="${x}" y1="${y - z - 2}" x2="${x}" y2="${y - z - 16}" stroke="#f59f00" stroke-width="2.5"/>`;
      [[40, 14], [52, 8]].forEach(([tx, ty]) => { s += box(tx, ty, 4, 12, 18, '#9aa0a6'); });
      return s + tree(-60, 4, 0.9) + pine(60, -16, 0.9) + tree(-48, 24, 0.7, '#6ab04c') + person(22, 30, 0); },
    clocktower: (c, anim, o = {}) => { let s = tree(-64, 4, 1) + tree(-52, 22, 0.85, '#6ab04c') + tree(66, -16, 0.9); const x = -18, y = -18;
      s += shadow(x + 8, y + 6, 24) + box(x, y, 30, 30, 92, '#e4d6b8');
      const clock = `<circle cx="15" cy="-74" r="9.5" fill="#fff" stroke="${shade(c, -0.3)}" stroke-width="2"/><line x1="15" y1="-74" x2="15" y2="-80" stroke="#333" stroke-width="1.4"/><line x1="15" y1="-74" x2="19" y2="-72" stroke="#333" stroke-width="1.4"/>`;
      s += onLeft(x, y, 30, 30, 0, clock + `<rect x="9" y="-50" width="12" height="16" fill="${shade(c, 0.6)}"/>`) + onRight(x, y, 30, 30, 0, clock);
      s += box(x, y, 36, 36, 6, c, 92) + roof(x, y, 34, 34, 98, 32, shade(c, -0.25));
      s += shadow(36, 26, 26) + box(32, 22, 44, 16, 22, '#e03131', 2) + onLeft(32, 22, 44, 16, 2, [6, 16, 26, 36].map(v => `<rect x="${v}" y="-19" width="7" height="5" fill="#d0ebff"/><rect x="${v}" y="-11" width="7" height="5" fill="#d0ebff"/>`).join(''));

    s += `<ellipse class="pm-ring" cx="0" cy="${T / 2}" rx="${f1(R * 1.22)}" ry="${f1(R * 0.66)}" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>`;

    const r = rng(11); for (let i = 0; i < W / 40; i++) { const x = r() * W, y = 150 + r() * 100, ww = 10 + r() * 14; s += `<path d="M${f1(x)},${f1(y)}q${f1(ww / 2)},-4 ${f1(ww)},0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>`; }
    const islet = (x, y, k) => `<g transform="translate(${x},${y}) scale(${k})"><ellipse cx="0" cy="18" rx="70" ry="22" fill="#efe3c4"/><ellipse cx="0" cy="12" rx="56" ry="17" fill="#c4e5aa"/>${tree(-18, 12, 1)}${tree(16, 16, 0.8, '#6ab04c')}${pine(2, 6, 0.9)}</g>`;
    s += narrow ? islet(120, 150, 0.55) : islet(330, 150, 0.6) + islet(760, 140, 0.5);
    s += `<line x1="${narrow ? 40 : 90}" y1="232" x2="${ix - 70}" y2="232" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".9"/>`;
    s += `<g transform="translate(${ix},${iy}) scale(${narrow ? 0.62 : 0.78})">${islandSVG(kind, c, 92, false).replace(/<ellipse class="pm-ring"[^>]*\/>/, '')}</g>`;
    s += `</g><g class="pm-boatpos"><g transform="translate(0,226)"><ellipse cx="0" cy="8" rx="20" ry="4" fill="rgba(10,50,70,.15)"/><path d="M-17,0h34l-6,8h-22z" fill="#fff"/><path d="M-17,0h34l-1.5,2.5h-31z" fill="${c}" opacity=".7"/>
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#6b7c85" stroke-width="1.5"/><path d="M1,-27l14,22h-14z" fill="#fff"/><path d="M-1,-21l-10,16h10z" fill="#f1f3f5"/><path d="M0,-28l9,3l-9,3z" fill="${c}"/></g></g></svg>`;
    return { svg: s, x0: narrow ? 40 : 90, x1: ix - 100 };
  }
  function sceneTick() {
    const cfgs = SCENE ? [SCENE] : []; const cfg = cfgs[0]; if (!cfg) return;
    let el = document.getElementById('pe-scene'), act = false;
    try { act = !!cfg.active(); } catch (e) {}
    if (!act) { if (el) el.remove(); const ob = document.getElementById('pe-scene-btn'); if (ob) ob.remove(); document.body.classList.remove('pe-scene-on', 'pe-scene-compact'); sceneSig = ''; return; }
    if (!document.getElementById('pe115-scene-css')) { const st = document.createElement('style'); st.id = 'pe115-scene-css'; st.textContent = sceneCSS; document.head.appendChild(st); }
    const on = sceneOn(), compact = !!(cfg.compact && cfg.compact()), w = window.innerWidth;
    const kb = window.visualViewport && window.visualViewport.height < window.innerHeight * 0.72;   // 手機鍵盤跳出時收起
    if (!el) { el = document.createElement('div'); el.id = 'pe-scene'; document.body.appendChild(el); }
    const sig = [cfg.kind(), cfg.color(), w < 700, on].join('|');
    if (sig !== sceneSig) { sceneSig = sig; const art = on ? sceneArt(cfg, w) : null;
      el.innerHTML = (art ? art.svg : '') + `<span class="pm-place"></span>`;
      el._x = art ? [art.x0, art.x1] : null; }
    let btn = document.getElementById('pe-scene-btn');
    if (!btn) { btn = document.createElement('button'); btn.type = 'button'; btn.id = 'pe-scene-btn'; document.body.appendChild(btn); }
    const bt = w < 700 ? (on ? '🌫️' : '🏝️') : (on ? '🌫️ 專注模式' : '🏝️ 顯示背景'); if (btn.textContent !== bt) { btn.textContent = bt; btn.title = on ? '關閉作答背景' : '開啟作答背景'; }
    el.classList.toggle('off', !on); el.classList.toggle('compact', on && (compact || kb));
    el.style.display = kb && w < 700 ? 'none' : '';
    document.body.classList.toggle('pe-scene-on', on); document.body.classList.toggle('pe-scene-compact', on && compact);
    const pl = el.querySelector('.pm-place'); if (pl) { const t = '📍 ' + (cfg.place ? cfg.place() : ''); if (pl.textContent !== t) pl.textContent = t; }
    const b = el.querySelector('.pm-boatpos'); if (b && el._x) { const [d, n] = cfg.progress ? cfg.progress() : [0, 1]; const x = el._x[0] + (el._x[1] - el._x[0]) * Math.min(1, n ? d / n : 0);
      b.style.transition = 'transform .8s ease'; b.style.transform = `translateX(${f1(x)}px)`; }
    const card = cfg.card && cfg.card(); if (card && !card.classList.contains('pm-float')) card.classList.add('pm-float');
    const ok = cfg.correct && cfg.correct(); if (ok && ok !== lastOk) { el.classList.add('glow'); setTimeout(() => el.classList.remove('glow'), 1100); } lastOk = ok || '';
  }
  let sq = false; const sceneSchedule = () => { if (!sq) { sq = true; requestAnimationFrame(() => { sq = false; try { sceneTick(); } catch (e) { console.warn('PE115Map.scene', e); } }); } };
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('#pe-scene-btn')) { try { localStorage.setItem(SCENE_KEY, sceneOn() ? 'off' : 'on'); } catch (err) {} sceneSig = ''; sceneSchedule(); } });
  window.addEventListener('scroll', sceneSchedule, { passive: true });
  window.addEventListener('resize', sceneSchedule); if (window.visualViewport) window.visualViewport.addEventListener('resize', sceneSchedule);
  new MutationObserver(m => { if (SCENE && m.some(x => !(x.target.closest && x.target.closest('#pe-scene, #pe-scene-btn')) && x.target.id !== 'pe-scene-btn')) sceneSchedule(); }).observe(document.documentElement, { childList: true, subtree: true });
  window.PE115Map = { add(cfg) { CONFIGS.push(cfg); schedule(); }, scene(cfg) { SCENE = cfg; sceneSchedule(); }, refresh: schedule, kinds: Object.keys(L) };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
<script id="pe115-map-config">
/* 英文：首頁課次卡片 → 島嶼（L3 找水的鳥・L4 YouTuber 攝影棚・R2 字母積木・模擬段考） */
PE115Map.add({
  key: 'home', anchor: '#app > .grid', items: '#app > .grid > .lcard',
  name: el => el.querySelector('.ttl').textContent,
  sub: el => { if (el.classList.contains('locked')) return '🔒 三課達標後解鎖'; const s = el.querySelectorAll('.meta span'); const t = s.length ? s[s.length - 1].textContent : ''; return t.length > 18 ? t.slice(0, 17) + '…' : t; },
  kind: el => { const m = ((el.getAttribute('onclick') || '').match(/'(\w+)'/) || [])[1]; return { L3: 'well', L4: 'studio', R2: 'blocks' }[m] || 'trophy'; },
  color: el => getComputedStyle(el.querySelector('.ttl')).color,
  locked: el => el.classList.contains('locked')
});
/* 作答背景：淡淡的所在島嶼＋航向該島的小船（模擬段考預設精簡） */
PE115Map.scene({
  active: () => !!document.querySelector('#app > .qcard'),
  card: () => document.querySelector('#app > .qcard'),
  kind: () => { try { if (Q.mode === 'exam') return 'trophy'; return { L3: 'well', L4: 'studio', R2: 'blocks' }[Q.L.id] || 'blocks'; } catch (e) { return 'blocks'; } },
  color: () => { try { return Q.L.color || '#7048e8'; } catch (e) { return '#7048e8'; } },
  place: () => { try { return Q.mode === 'exam' ? '英文島 › 模擬段考' : `英文島 › ${Q.L.title} › ${Q.U.title}${Q.retry ? '（錯題重練）' : ''}`; } catch (e) { return '英文島'; } },
  progress: () => { try { const n = Q.items.length; return [Q.mode === 'exam' ? Q.ans.filter(x => x != null).length : Q.res.filter(Boolean).length, n]; } catch (e) { return [0, 1]; } },
  correct: () => { try { const r = Q.res[Q.i]; return r && r.ok ? 'q' + Q.i + (Q.retry ? 'r' : '') : ''; } catch (e) { return ''; } },
  compact: () => { try { return Q.mode === 'exam'; } catch (e) { return false; } }
});
</script>
