<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八年級國文 第三次段考強化練習</title>
<script id="pe115-level">
/* 一一五上學期段考強化練習｜練習等級（共用元件，各練習頁相同）
   100%＝★★★★★、90%＝★★★★、80%＝★★★、70%＝★★、60%＝★，未滿 60% 尚未評級
   成績存在 localStorage「pe115:levels」，入口網站讀同一份資料顯示各科練習等級。 */
window.PE115 = (function () {
  var KEY = 'pe115:levels';
  var m = location.pathname.match(/([a-z]+115010\d)\.html?$/i);
  var FILE = m ? m[1].toLowerCase() + '.html' : null;
  function stars(p) { p = +p || 0; return p >= 99.95 ? 5 : p >= 90 ? 4 : p >= 80 ? 3 : p >= 70 ? 2 : p >= 60 ? 1 : 0; }
  function starStr(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  function get() { return FILE ? load()[FILE] || null : null; }
  function label(p) { var s = stars(p); return s ? '練習等級 ' + starStr(s) : '尚未評級'; }
  function commit(pct, note, thisRun) {
    if (!FILE) return;
    var d = load(), r = d[FILE] || { best: 0, tries: 0 };
    var before = stars(r.best);
    r.tries = (r.tries || 0) + 1; r.last = Math.round(pct); r.best = Math.max(r.best || 0, Math.round(pct));
    r.stars = stars(r.best); r.at = Date.now(); if (note) r.note = note;
    d[FILE] = r; save(d); paint();
    toast(thisRun, r, before, note);
  }
  /* 單一段考衝刺測驗：pct 為 0–100 */
  function report(pct, note) { commit(pct, note, Math.round(pct)); }
  /* 由多份測驗合成（例：兩關取較低、三科模擬卷平均）；未做的部分以 0 計 */
  function part(id, pct, allIds, mode, note) {
    if (!FILE) return;
    var d = load(), r = d[FILE] || { best: 0, tries: 0 };
    r.parts = r.parts || {}; r.parts[id] = Math.max(r.parts[id] || 0, Math.round(pct));
    d[FILE] = r; save(d);
    var vals = allIds.map(function (k) { return r.parts[k] || 0; });
    var agg = mode === 'min' ? Math.min.apply(null, vals) : vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    commit(agg, note + ' ' + Math.round(agg) + '%', Math.round(pct));
  }
  function paint() {
    var r = get(), els = document.querySelectorAll('.pe-level');
    for (var i = 0; i < els.length; i++) {
      var html = r && r.stars
        ? '<b>' + label(r.best) + '</b>（段考衝刺最佳 ' + r.best + '%' + (r.note ? '・' + r.note.replace(/ \d+%$/, '') : '') + '）'
        : '練習等級：尚未評級（段考衝刺答對 60% 以上就會評級）';
      if (els[i].getAttribute('data-pe') !== html) { els[i].innerHTML = html; els[i].setAttribute('data-pe', html); }
    }
  }
  function toast(thisRun, r, before, note) {
    var t = document.getElementById('pe-toast');
    if (!t) { t = document.createElement('div'); t.id = 'pe-toast'; document.body.appendChild(t); }
    var up = r.stars > before;
    t.innerHTML = '本次 ' + thisRun + '%' + (note ? '｜' + note : '') + '<br><b>' + (r.stars ? label(r.best) : '練習等級：尚未評級') + '</b>' + (up ? '　⬆ 升級！' : '');
    t.className = 'show';
    clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, 5000);
  }
  var css = document.createElement('style');
  css.textContent = '#pe-toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:2147483001;' +
    'background:rgba(31,36,51,.94);color:#fff;padding:12px 20px;border-radius:14px;text-align:center;line-height:1.6;' +
    'font:600 15px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:.3s}' +
    '#pe-toast.show{opacity:1;transform:translate(-50%,0)}#pe-toast b{color:#ffd43b;font-size:17px}' +
    '.pe-level b{letter-spacing:1px}@media print{#pe-toast{display:none}}';
  document.head.appendChild(css);
  function watch() {
    paint();
    try { new MutationObserver(function () { if (document.querySelector('.pe-level:not([data-pe])')) paint(); })
      .observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  return { stars: stars, starStr: starStr, label: label, report: report, part: part, get: get, paint: paint };
})();
</script>

<script>
/* ================= 題目建構工具 ================= */
const LESSONS = [];
let _gid = 0;
const SPLIT = s => Array.from(s);
const word = (s, a) => s.replace(/「(.+?)」/, a).replace(/[「」]/g, "");
const MC = (q, opts, exp, tag) => ({ t: "mc", q, opts, exp, tag });
const FX = (q, opts, exp, tag) => ({ t: "mc", q, opts, exp, tag, fx: true });
// 注音 → 國字：Z(題目, 正解, 干擾字串, 補充)
const Z = (s, a, d, note) => ({ t: "mc", kind: "zy", ph: s, q: "", opts: ["*" + a].concat(SPLIT(d)), tag: "注音寫國字",
  exp: `正確寫法：${word(s, a)}。${note || ""}` });
// 國字 → 注音：Y(題目, 正解, 干擾（空白分隔）, 補充)
const Y = (s, a, d, note) => ({ t: "mc", kind: "zy", bp: true, ph: s, q: "", opts: ["*" + a].concat(d.split(" ")), tag: "國字寫注音",
  exp: `「${(s.match(/「(.+?)」/) || [, ""])[1]}」在「${s.replace(/[「」]/g, "")}」中讀 ${a}。${note || ""}` });
// 注釋：N(語詞, 正解, 干擾（| 分隔）, 補充)
const N = (s, a, d, note) => ({ t: "mc", kind: "nt", ph: s, q: "", opts: ["*" + a].concat(d.split("|")), tag: "注釋",
  exp: `${s}：${a}。${note || ""}` });
// 句型判斷：SE(句子, 句型代號 0敘事 1有無 2判斷 3表態, 說明)
const STYPES = ["敘事句", "有無句", "判斷句", "表態句"];
const SE = (s, k, exp) => ({ t: "mc", kind: "se", ph: s, q: "", opts: STYPES.map((x, i) => (i === k ? "*" : "") + x), fx: true, tag: "句型判斷", exp });
// 改錯字：E("句子{錯>正}句子", 說明)
const E = (s, exp) => { const m = s.match(/\{(.)>(.)\}/); const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);

  points: ["注音 100 則", "注釋 50 則", "字音字義辨析", "形近字改錯", "閱讀測驗", "模擬段考"],
  units: [
  { id: "R-1", icon: "🔤", title: "國字注音（全）", desc: "第三次段考 100 則一次練完", qs: ZY7.concat(ZY8, ZY9, ZY10) },
  { id: "R-2", icon: "📖", title: "注釋（全）", desc: "第三次段考 50 則一次練完", qs: NT7.concat(NT8, NT9, NT10) },
  { id: "R-3", icon: "🔍", title: "字音字義辨析", desc: "一字多音・一字多義・成語", qs: WORDS },
  { id: "R-4", icon: "🔎", title: "形近字改錯", desc: "點出錯字", qs: SHAPE },
  { id: "R-5", icon: "📰", title: "閱讀測驗", desc: "課外文章 × 課文連結", qs: READ },
  { id: "R-6", icon: "🏆", title: "模擬段考", desc: "每次隨機出題・滿分 100", exam: true, qs: [] }
  ]
});

/* 模擬段考：每次從題庫隨機抽題，配分比照第三次段考模擬試卷（注音 12、注釋 10、綜合 66、閱讀 12） */
const POOL_MC = () => LESSONS.filter(L => L.id !== "REV").flatMap(L => L.units.slice(2).flatMap(u => u.qs)).filter(q => q.t === "mc" && !q.psg);
const MOCK = {
  color: "#b07800", soft: "#fff3d6",
  sections: [
    { name: "一、注音國字", pts: 2, draw: () => sample(ZY7.concat(ZY8, ZY9, ZY10), 6) },
    { name: "二、注釋", pts: 2, draw: () => sample(NT7.concat(NT8, NT9, NT10), 5) },
    { name: "三、綜合測驗", pts: 3, draw: () => sample(POOL_MC(), 22) },
    { name: "四、閱讀測驗", pts: 4, draw: () => { const ids = [...new Set(READ.map(q => q.psg.id))]; const id = ids[Math.floor(Math.random() * ids.length)]; return READ.filter(q => q.psg.id === id); } }
  ]
};
</script>
<script>
/* ================= 練習引擎 ================= */
const KEY = "chi1150103_progress";
const STUDY = LESSONS.flatMap(L => L.units.filter(u => !u.exam));
const TOTAL_UNITS = STUDY.length;
let P = loadP(); migrateStars();
let Q = null;
const $app = document.getElementById("app");

function loadP() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  return Object.assign({ units: {}, xp: 0, mock: null }, d || {});
}
function saveP() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

/* ---------- 小工具 ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const strip = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "");
const hl = s => esc(s).replace(/「(.+?)」/g, '<span class="hl">$1</span>');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }
function starsOf(pct) { return PE115.stars(pct * 100); }
function migrateStars() { Object.values(P.units || {}).forEach(u => { if (u && u.best != null) u.stars = starsOf(u.best); }); }
function starHTML(n, max = 5) { let h = ""; for (let i = 0; i < max; i++) h += i < n ? "★" : '<span class="off">★</span>'; return '<span class="stars">' + h + "</span>"; }
const studyUnits = L => L.units.filter(u => !u.exam);
function lessonStars(L) { return studyUnits(L).reduce((s, u) => s + ((P.units[u.id] || {}).stars || 0), 0); }
function totalStars() { return LESSONS.reduce((s, L) => s + lessonStars(L), 0); }
function rankOf(st) {
  const max = TOTAL_UNITS * 5;
  if (st >= max) return "👑 國文王者";
  if (st >= 83) return "🏅 段考達人";
  if (st >= 52) return "⚔️ 闖關高手";
  if (st >= 21) return "📜 國文探險家";
  return "🌱 見習書生";
}
function mockUnlocked() {
  /* 2026-11-26 老師決定：段考模擬不設門檻，直接開放 */
  return true;
  if (/unlock/.test(location.search + location.hash)) return true;
  return LESSONS.filter(L => L.id !== "REV").every(L => studyUnits(L).filter(u => ((P.units[u.id] || {}).stars || 0) >= 1).length >= 2);
}
function setTheme(c, soft) { document.documentElement.style.setProperty("--accent", c); document.documentElement.style.setProperty("--soft", soft); }

/* ================= 首頁 ================= */
function showHome() {
  Q = null;
  setTheme("#8b3a3a", "#f6e6e3");
  const st = totalStars(), max = TOTAL_UNITS * 5;
  const cards = LESSONS.map(L => {
    const s = lessonStars(L), m = studyUnits(L).length * 5;
    const extra = L.id === "REV" ? `<span>🏆 ${P.mock != null ? "模擬段考最佳 " + P.mock + " 分" : mockUnlocked() ? "模擬段考已開放" : "模擬段考未解鎖"}</span>` : `<span>${L.units.length} 個小單元</span>`;
    return `<button class="lcard" onclick="showLesson('${L.id}')">
      <div class="top"><div class="ico" style="background:${L.soft}">${L.icon}</div>
      <div><div class="ttl" style="color:${L.color}">${L.title}</div><div class="en">${L.en}</div></div></div>
      <div class="pts">${L.points.map(p => `<span class="chip">${p}</span>`).join("")}</div>
      <div class="bar"><i style="width:${s / m * 100}%;background:${L.color}"></i></div>
      <div class="meta">${extra}<span>★ ${s} / ${m}${s === m ? "　🎖️ " + L.badge : ""}</span></div>
    </button>`;
  }).join("");
  $app.innerHTML = `
    <div class="hero"><div class="deco">文</div>
      <h1>八年級國文 第三次段考強化練習</h1>
      <div class="sub">範圍：第七課 張釋之執法・第八課 找尋失落的水源・第九課 一棵開花的樹・第十課 畫的哀傷</div>
      <div class="sub">特色：課文闖關｜每課 4 個小單元，答對得 ★ 與 XP，模擬段考直接開放挑戰</div>
      <div class="sub pe-level"></div>
      <div class="stats">
        <div class="stat"><b>★ ${st}</b>/ ${max}</div>
        <div class="stat"><b>${P.xp}</b>XP</div>
        <div class="stat"><span class="rank">${rankOf(st)}</span></div>
      </div>
    </div>
    <details class="pe-howto" open><summary>📌 怎麼用：課前預習・課後複習・自主練習・段考衝刺</summary><ul><li><b>📖 課前預習：</b>上新課前，先做該課的「國字注音」「注釋」，認識生難字詞。</li><li><b>✍️ 課後複習：</b>上完一課，做「課文選擇題」和該課的特色單元（廷尉斷案室、感官偵測站、意象解碼、心情調色盤）。</li><li><b>🎯 自主練習：</b>答錯的題目在結果頁按「錯題重練」再挑戰，把每個小單元練到 ★★★。</li><li><b>🏆 段考衝刺：</b>到「段考複習」練注音 100 則、注釋 50 則、字音字義辨析與形近字改錯，最後挑戰模擬段考。</li></ul></details>
    <div class="grid">${cards}</div>
    <div class="howto"><b>闖關規則</b>　每個小單元依答對率得星：60% ★、70% ★★、80% ★★★、90% ★★★★、全對 ★★★★★。模擬段考的成績就是本頁的「練習等級」。答對 +10 XP，連續答對還有 🔥 連擊加分。答錯的題目會在結果頁整理出來，可以按「錯題重練」再挑戰。「段考複習」的 🏆 模擬段考隨時可以挑戰！</div>
    <footer>八年級國文 第三次段考 L7–L10 練習</footer>`;
  scrollTo(0, 0);
}
function alertBox(t, m) {
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:9;padding:16px";
  d.innerHTML = `<div style="background:#fff;border-radius:18px;padding:22px;max-width:420px;text-align:center"><div style="font-weight:800;font-size:20px">${t}</div><p>${m}</p><button class="btn">知道了</button></div>`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}
function lockedMsg() { alertBox("🔒 模擬段考尚未解鎖", "L7、L8、L9、L10 每一課都至少要在 2 個小單元拿到 ★，才能挑戰模擬段考。加油！"); }

/* ================= 課次頁 ================= */
function showLesson(id) {
  Q = null;
  const L = LESSONS.find(x => x.id === id);
  setTheme(L.color, L.soft);
  const us = L.units.map((u, i) => {
    if (u.exam) {
      const ok = mockUnlocked();
      return `<button class="ucard exam ${ok ? "" : "locked"}" onclick="${ok ? "startMock()" : "lockedMsg()"}">
        ${ok ? "" : '<span class="lock">🔒 未解鎖</span>'}
        <div class="no" style="background:#fff3d6">${u.icon}</div>
        <div><div class="t">${i + 1}. ${u.title}</div><div class="d">注音 6・注釋 5・綜合 22・閱讀 1 組<br>${u.desc}</div>
        <div class="s">${P.mock != null ? "最佳成績 " + P.mock + " 分" : ok ? "尚未挑戰" : "L7～L10 各 2 個小單元拿到 ★ 即可解鎖"}</div></div>
      </button>`;
    }
    const r = P.units[u.id] || {};
    return `<button class="ucard" onclick="startUnit('${L.id}','${u.id}')">
      <div class="no">${u.icon}</div>
      <div><div class="t">${i + 1}. ${u.title}</div><div class="d">${u.desc}</div>
      <div class="s">${starHTML(r.stars || 0)}　${u.qs.length} 題${r.best != null ? "・最佳 " + Math.round(r.best * 100) + "%" : ""}</div></div>
    </button>`;
  }).join("");
  const s = lessonStars(L), m = studyUnits(L).length * 5;
  $app.innerHTML = `
    <div class="topbar"><button class="back" onclick="showHome()">← 回首頁</button><span class="pill">★ ${s} / ${m}</span>${s === m ? `<span class="pill">🎖️ ${L.badge}</span>` : ""}</div>
    <div class="banner" style="background:linear-gradient(135deg,${L.color},${L.color}cc)"><div class="big">${L.icon}</div>
      <h2>${L.title}</h2><div class="en">${L.en}</div>
      <div class="pts">${L.points.map(p => `<span class="chip">${p}</span>`).join("")}</div></div>
    <div class="units">${us}</div>`;
  scrollTo(0, 0);
}

/* ================= 建立測驗 ================= */
function prep(q) {
  const o = Object.assign({}, q);
  if (o.t === "mc") {
    const raw = o.opts.map(s => ({ txt: s.replace(/^\*/, ""), ok: s[0] === "*" }));
    const sh = o.fx ? raw : shuffle(raw);
    o.o = sh.map(x => x.txt); o.ci = sh.findIndex(x => x.ok);
  }
  return o;
}
function orderItems(qs) {
  const singles = qs.filter(q => !q.psg), groups = [];
  qs.filter(q => q.psg).forEach(q => { let g = groups.find(x => x[0].psg.id === q.psg.id); if (!g) groups.push(g = []); g.push(q); });
  return shuffle(singles).concat(shuffle(groups).flat()).map(prep);
}
function newQ(extra) { return Object.assign({ i: 0, xp: 0, combo: 0, best: 0, psgOpen: true }, extra, { ans: extra.items.map(() => null), res: extra.items.map(() => null) }); }
function startUnit(lid, uid) {
  const L = LESSONS.find(x => x.id === lid), U = L.units.find(x => x.id === uid);
  setTheme(L.color, L.soft);
  Q = newQ({ mode: "practice", L, U, title: `${L.title}｜${U.title}`, items: orderItems(U.qs) });
  renderQ();
}
function retryWrong() {
  const wrong = Q.items.filter((q, k) => !(Q.res[k] && Q.res[k].ok));
  if (!wrong.length) return;
  const L = Q.L, U = Q.U;
  Q = newQ({ mode: "practice", retry: true, L, U, title: `${L.title}｜${U.title}（錯題重練）`, items: orderItems(wrong) });
  renderQ();
}
function startMock() {
  setTheme(MOCK.color, MOCK.soft);
  const items = [];
  MOCK.sections.forEach((s, si) => s.draw().forEach(q => { const o = prep(q); o.sec = si; o.pts = s.pts; items.push(o); }));
  Q = newQ({ mode: "exam", L: LESSONS.find(x => x.id === "REV"), title: "🏆 模擬段考", items });
  renderQ();
}

/* ================= 判斷對錯 ================= */
function isRight(q, a) {
  if (a == null) return false;
  if (q.t === "mc") return a === q.ci;
  if (q.t === "err") return a === q.ei;
  return false;
}
function corrText(q) {
  if (q.t === "mc") return `(${"ABCD"[q.ci]}) ${q.o[q.ci]}`;
  if (q.t === "err") return `「${q.bad}」應改為「${q.good}」`;
}
function givenText(q, a) {
  if (a == null) return "（未作答）";
  if (q.t === "mc") return `(${"ABCD"[a]}) ${q.o[a]}`;
  if (q.t === "err") return `點了「${q.chars[a]}」`;
}
function stemText(q) {
  if (q.t === "err") return "找錯字：" + q.chars.map((c, k) => k === q.ei ? "【" + c + "】" : c).join("");
  let s = "";
  if (q.psg) s = `【${q.psg.title}】`;
  if (q.kind === "zy") return s + q.ph;
  if (q.kind === "nt") return s + q.ph + "　的意思";
  if (q.kind === "se") return s + q.ph;
  return s + strip(q.q);
}
const isPunc = c => /[，。、；：？！「」『』（）…—\s]/.test(c);

/* ================= 作答畫面 ================= */
function renderQ() {
  const q = Q.items[Q.i], n = Q.items.length, done = Q.res[Q.i] != null, exam = Q.mode === "exam";
  const a = Q.ans[Q.i];
  const correct = Q.res.filter(r => r && r.ok).length;
  let head = `<div class="qhead"><button class="back" onclick="quitQ()">✕</button><div class="name">${Q.title}</div>
    <span class="pill">${Q.i + 1} / ${n}</span>`;
  if (exam) head += `<span class="pill">${MOCK.sections[q.sec].name}（每題 ${q.pts} 分）</span>`;
  else head += `<span class="pill">✔ ${correct}</span><span class="pill">${Q.xp} XP</span>${Q.combo >= 2 ? `<span class="pill combo">🔥 ${Q.combo} 連擊</span>` : ""}`;
  head += `</div><div class="prog"><i style="width:${(exam ? Q.ans.filter(x => x != null).length : Q.res.filter(Boolean).length) / n * 100}%"></i></div>`;

  let psg = "";
  if (q.psg) {
    psg = `<div class="psg"><div class="ph"><span>📖 閱讀　<b>${q.psg.title}</b></span><button class="tog" onclick="Q.psgOpen=!Q.psgOpen;renderQ()">${Q.psgOpen ? "收合文章 ▲" : "展開文章 ▼"}</button></div>
      <div class="body ${Q.psgOpen ? "" : "hidden"}">${q.psg.html}${q.psg.notes ? `<div class="notes">📝 ${q.psg.notes}</div>` : ""}</div></div>`;
  }

  let card = `<div class="qcard"><span class="tag">${q.tag || "選擇題"}</span>`;
  const lock = done && !exam;

  if (q.t === "mc") {
    let gridCls = "";
    if (q.kind === "zy") {
      card += `<div class="ask">${q.bp ? "請選出「 」內國字的正確注音" : "請選出「 」內注音的正確國字"}</div><div class="phrase">${hl(q.ph)}</div>`;
      gridCls = "zy";
    } else if (q.kind === "nt") {
      card += `<div class="phrase">${hl(q.ph)}</div><div class="ask">${/「/.test(q.ph) ? "「 」內字詞的意思是？" : "這個語詞的意思是？"}</div>`;
    } else if (q.kind === "se") {
      card += `<div class="phrase" style="font-size:26px;letter-spacing:2px">${esc(q.ph)}</div><div class="ask">${q.q || (q.tag === "論證法判斷" ? "這段文字運用了哪一種論證法？" : "這個句子屬於哪一種句型？")}</div>`;
      gridCls = q.two || q.o.length === 4 ? "two" : "";
    } else {
      card += `<div class="stem">${q.q}</div>`;
    }
    card += `<div class="opts ${gridCls}">`;
    q.o.forEach((t, k) => {
      let cls = "";
      if (lock) { if (k === q.ci) cls = "right"; else if (k === a) cls = "wrong"; }
      else if (a === k) cls = "sel";
      const v = q.kind === "zy" ? `<span class="v ${q.bp ? "bpmf" : ""}">${t}</span>` : `<span>${t}</span>`;
      card += `<button class="opt ${cls}" ${lock ? "disabled" : ""} onclick="pick(${k})"><span class="k">${"ABCD"[k]}</span>${v}</button>`;
    });
    card += `</div>`;
  } else if (q.t === "err") {
    card += `<div class="ask">這個句子裡有一個錯字，請點出來！</div><div class="sent">`;
    q.chars.forEach((c, k) => {
      if (isPunc(c)) { card += `<span class="pu">${c}</span>`; return; }
      let cls = "", fix = "";
      if (lock) { if (k === q.ei) { cls = "right"; fix = `<span class="fix">${q.good}</span>`; } else if (k === a) cls = "wrong"; }
      else if (a === k) cls = "sel";
      card += `<button class="ch ${cls}" ${lock ? "disabled" : ""} onclick="pick(${k})">${fix}${c}</button>`;
    });
    card += `</div>`;
  }

  let tools = "";
  if (exam) {
    tools = `<div class="tools"><button class="btn ghost" ${Q.i === 0 ? "disabled" : ""} onclick="move(-1)">← 上一題</button>
      ${Q.i < n - 1 ? `<button class="btn" onclick="move(1)">下一題 →</button>` : ""}
      <button class="btn" style="background:#b07800" onclick="submitExam()">📮 交卷</button></div>
      <div class="navx">${Q.items.map((_, k) => `<button class="${k === Q.i ? "cur" : Q.ans[k] != null ? "done" : ""}" onclick="jump(${k})">${k + 1}</button>`).join("")}</div>`;
  } else if (done) {
    const r = Q.res[Q.i];
    tools = `<div class="fb ${r.ok ? "ok" : "no"}"><div class="h">${r.ok ? "✔ 答對了！" + (r.gain ? ` +${r.gain} XP` : "") : "✘ 再想想！正確答案是："}</div>
      ${r.ok ? "" : `<div class="ca">${corrText(q)}</div>`}
      <div class="ex">💬 ${q.exp}</div></div>
      <div class="tools"><button class="btn" id="nextBtn" onclick="nextQ()">${Q.i < n - 1 ? "下一題 →" : "看結果 🏁"}</button></div>`;
  }
  card += tools + `</div>`;
  $app.innerHTML = head + psg + card;
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({ preventScroll: true });
}

/* ---------- 互動 ---------- */
function pick(k) {
  if (Q.mode === "exam") { Q.ans[Q.i] = k; renderQ(); return; }
  if (Q.res[Q.i]) return;
  Q.ans[Q.i] = k; check();
}
function check() {
  const q = Q.items[Q.i], a = Q.ans[Q.i];
  const ok = isRight(q, a);
  let gain = 0;
  if (ok) { Q.combo++; gain = 10 + (Q.combo >= 3 ? Math.min(Q.combo - 2, 5) * 2 : 0); Q.xp += gain; Q.best = Math.max(Q.best, Q.combo); flash("+" + gain + " XP", null); }
  else Q.combo = 0;
  Q.res[Q.i] = { ok, gain };
  renderQ();
}
function flash(t, color) { const d = document.createElement("div"); d.className = "xp-pop"; d.textContent = t; if (color) d.style.color = color; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
function nextQ() { if (Q.i < Q.items.length - 1) { Q.i++; renderQ(); scrollTop(); } else finishPractice(); }
function move(d) { Q.i = Math.min(Math.max(Q.i + d, 0), Q.items.length - 1); renderQ(); scrollTop(); }
function jump(k) { Q.i = k; renderQ(); scrollTop(); }
function scrollTop() { scrollTo({ top: 0, behavior: "smooth" }); }
document.addEventListener("keydown", e => {
  if (!Q || e.target.tagName === "INPUT") return;
  const q = Q.items[Q.i];
  if (e.key === "Enter") { const nb = document.getElementById("nextBtn"); if (nb) { e.preventDefault(); nb.click(); } return; }
  if (q.t === "mc") { const k = "1234abcd".indexOf(e.key.toLowerCase()) % 4; if (k >= 0 && k < q.o.length && !(Q.mode !== "exam" && Q.res[Q.i])) pick(k); }
});
function quitQ() {
  const started = Q.ans.some(x => x != null);
  if (started && !window.confirm("確定要離開嗎？這次的作答不會記錄。")) return;
  showLesson(Q.L.id);
}

/* ================= 結果 ================= */
function reviewHTML(onlyWrong) {
  return Q.items.map((q, k) => {
    const ok = Q.res[k] && Q.res[k].ok;
    if (onlyWrong && ok) return "";
    return `<div class="ritem ${ok ? "okk" : ""}"><div class="rq"><b>${k + 1}.</b> ${esc(stemText(q))}</div>
      ${ok ? "" : `<div class="ry">你的答案：${givenText(q, Q.ans[k])}</div>`}
      <div class="rc">${ok ? "✔ " : "正解："}${corrText(q)}</div><div class="re">💬 ${q.exp}</div></div>`;
  }).join("");
}
function finishPractice() {
  const n = Q.items.length, c = Q.res.filter(r => r && r.ok).length, pct = c / n, st = starsOf(pct);
  let newBest = false;
  if (!Q.retry) {
    const prev = P.units[Q.U.id] || {};
    newBest = st > (prev.stars || 0);
    P.units[Q.U.id] = { stars: Math.max(st, prev.stars || 0), best: Math.max(pct, prev.best || 0) };
  }
  P.xp += Q.xp; saveP();
  const list = Q.L.units, idx = list.findIndex(u => u.id === Q.U.id), nu = list[idx + 1];
  const msg = st === 5 ? "太強了！全對五顆星 🎉" : st >= 3 ? "很不錯！再挑戰拿五顆星吧！" : st >= 1 ? "有星星了！把錯題看一遍再挑戰。" : "別灰心，看完詳解再試一次！";
  const wrong = n - c;
  const nextBtn = nu && !nu.exam ? `<button class="btn ghost" onclick="startUnit('${Q.L.id}','${nu.id}')">下一單元：${nu.title} →</button>` : `<button class="btn ghost" onclick="showLesson('${Q.L.id}')">回 ${Q.L.title}</button>`;
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showLesson('${Q.L.id}')">← 回 ${Q.L.title}</button></div>
    <div class="result"><div class="bigstars">${starHTML(st).replace('class="stars"', "")}</div>
      <h2>${Q.U.icon} ${Q.U.title}${Q.retry ? "（錯題重練）" : ""}</h2><div class="score">${c} / ${n}</div>
      <div>${msg}${newBest ? "　<b>（新紀錄！）</b>" : ""}</div>
      <div style="margin-top:8px;color:var(--muted)">本次獲得 <b>${Q.xp} XP</b>・最高連擊 🔥 ${Q.best}${Q.retry ? "・錯題重練不列入星等" : ""}</div>
      <div class="tools" style="justify-content:center">
        <button class="btn" onclick="startUnit('${Q.L.id}','${Q.U.id}')">↻ 整個單元再挑戰</button>
        ${wrong ? `<button class="btn" style="background:#c43c2f" onclick="retryWrong()">🔁 錯題重練（${wrong} 題）</button>` : ""}
        ${nextBtn}
      </div></div>
    <div class="review"><h3>${wrong ? `📌 錯題詳解（${wrong} 題）` : "📌 全部答對！以下是本單元詳解"}</h3>${reviewHTML(wrong > 0)}</div>`;
  scrollTo(0, 0);
}
function submitExam() {
  const blank = Q.ans.filter(x => x == null).length;
  if (blank && !window.confirm(`還有 ${blank} 題沒有作答，確定要交卷嗎？`)) return;
  let score = 0; const secs = MOCK.sections.map(s => ({ name: s.name, c: 0, n: 0, pts: 0, max: 0 }));
  Q.items.forEach((q, k) => { const ok = isRight(q, Q.ans[k]); Q.res[k] = { ok }; const s = secs[q.sec]; s.n++; s.max += q.pts; if (ok) { s.c++; s.pts += q.pts; score += q.pts; } });
  const first = P.mock == null;
  P.mock = Math.max(P.mock || 0, score); P.xp += score; saveP();
  PE115.report(score);
  const lv = PE115.label(score);
  $app.innerHTML = `<div class="topbar"><button class="back" onclick="showLesson('REV')">← 回段考複習</button></div>
    <div class="result"><div style="font-size:52px">🏆</div><h2>模擬段考成績</h2>
      <div class="score">${score} 分</div><div><b>${lv}</b>${!first && score >= P.mock ? "　（最佳紀錄）" : ""}</div>
      <div class="secs">${secs.map(s => `<div class="sec">${s.name}<b>${s.pts} / ${s.max} 分</b>答對 ${s.c} / ${s.n}</div>`).join("")}</div>
      <div class="tools" style="justify-content:center"><button class="btn" onclick="startMock()">↻ 換一份新考卷</button><button class="btn ghost" onclick="showHome()">回首頁</button></div></div>
    <div class="review"><h3>📌 錯題詳解（${Q.res.filter(r => !r.ok).length} 題）</h3>${reviewHTML(true)}</div>`;
  scrollTo(0, 0);
}

showHome();

  /* ---------- 一座島 ---------- */
  function islandSVG(kind, c, R, anim) {
    const T = 26, K = 0.5;
    const hex = (r, dy = 0) => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i; return [r * Math.cos(a), r * Math.sin(a) * K + dy]; });
    const sides = (r, y0, y1, cols) => { const h = hex(r); let s = '';
      [[0, 1], [1, 2], [2, 3]].forEach(([i, j], k) => { s += poly([[h[i][0], h[i][1] + y0], [h[j][0], h[j][1] + y0], [h[j][0], h[j][1] + y1], [h[i][0], h[i][1] + y1]], cols[k]); }); return s; };
    let s = `<ellipse cx="6" cy="${T + 14}" rx="${f1(R * 1.18)}" ry="${f1(R * 0.62)}" fill="rgba(10,50,70,.18)"/>` + poly(hex(R + 20, T + 2), 'rgba(255,255,255,.35)');
    s += sides(R + 11, T - 8, T + 2, ['#d8c69f', '#c9b58b', '#e2d3b0']) + poly(hex(R + 11, T - 8), '#efe3c4');
    s += sides(R, 0, 9, [shade(c, -0.25), shade(c, -0.05), shade(c, 0.12)]) + sides(R, 9, T - 7, ['#a99f8e', '#bdb4a3', '#d0c8b8']);
    s += poly(hex(R), '#b7dc9e') + poly(hex(R * 0.93), '#c4e5aa') + poly(hex(R * 0.6, 6), shade(c, 0.82), `stroke="${shade(c, 0.55)}" stroke-width="1.5"`);
    s += `<ellipse class="pm-ring" cx="0" cy="${T / 2}" rx="${f1(R * 1.22)}" ry="${f1(R * 0.66)}" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>`;
    const k = R / 92;
    return s + `<g transform="scale(${f1(k * 100) / 100})">${(L[kind] || L.books)(c, anim)}</g>`;
  }
  const tw = (str, size) => [...String(str)].reduce((a, ch) => a + (/[\x00-\xff]/.test(ch) ? 0.58 : 1) * size, 0);
  function labelSVG(no, name, sub, c, y, starry) {
    const nm = [...name].length > 13 ? [...name].slice(0, 12).join('') + '…' : name;
    const wNo = 26, W = Math.max(tw(nm, 19), tw(sub, 13)) + wNo + 34, x0 = -W / 2;
    return `<g transform="translate(0,${y})"><rect x="${f1(x0)}" y="-24" width="${f1(W)}" height="50" rx="20" fill="#fff" stroke="rgba(0,0,0,.06)"/>
      <text x="${f1(x0 + 14)}" y="-2" font-size="14" font-weight="800" fill="${c}">${typeof no === 'number' ? String(no).padStart(2, '0') : no}</text>
      <text x="${f1(x0 + 14 + wNo)}" y="0" font-size="19" font-weight="800" fill="#1f2433">${esc(nm)}</text>
      <text x="${f1(x0 + 14 + wNo)}" y="18" font-size="13" font-weight="700" fill="${starry ? '#e8590c' : '#868e96'}">${esc(sub)}</text></g>`;
  }
  const cloud = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})" fill="#fff" opacity=".9"><ellipse cx="0" cy="0" rx="34" ry="16"/><ellipse cx="-26" cy="6" rx="22" ry="12"/><ellipse cx="28" cy="6" rx="24" ry="12"/><ellipse cx="6" cy="-10" rx="20" ry="13"/></g>`;
  const boat = (x, y, col, i) => `<g transform="translate(${x},${y})"><g class="pm-boat" style="animation-delay:-${i * 5}s"><ellipse cx="0" cy="6" rx="16" ry="4" fill="rgba(10,50,70,.2)"/><path d="M-14,0h28l-5,7h-18z" fill="#fff"/><path d="M-14,0h28l-1.5,2h-25z" fill="${col}"/><line x1="0" y1="0" x2="0" y2="-24" stroke="#555" stroke-width="1.4"/><path d="M1,-23l12,19h-12z" fill="#fff"/><path d="M-1,-18l-9,15h9z" fill="#f1f3f5"/></g></g>`;
  function bridge(p, q) {
    const [x1, y1] = p, [x2, y2] = q, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), nx = -dy / len * 13, ny = dx / len * 13, Y = 6;
    const A = [x1, y1 + Y], B = [x2, y2 + Y]; let s = poly([[A[0] + nx, A[1] + ny + 10], [B[0] + nx, B[1] + ny + 10], [B[0] - nx, B[1] - ny + 10], [A[0] - nx, A[1] - ny + 10]], 'rgba(10,50,70,.2)');
    for (let t = 0.3; t <= 0.71; t += 0.2) s += `<rect x="${f1(x1 + dx * t - 3)}" y="${f1(y1 + Y + dy * t)}" width="6" height="22" fill="#8b6a4a"/>`;
    s += poly([[A[0] + nx, A[1] + ny + 6], [B[0] + nx, B[1] + ny + 6], [B[0] + nx, B[1] + ny], [A[0] + nx, A[1] + ny]], '#9c7652') + poly([[A[0] + nx, A[1] + ny], [B[0] + nx, B[1] + ny], [B[0] - nx, B[1] - ny], [A[0] - nx, A[1] - ny]], '#d7b07f');
    for (let t = 0; t <= 1; t += 12 / len) { const px = x1 + dx * t, py = y1 + Y + dy * t; s += line([px + nx, py + ny], [px - nx, py - ny], '#b68c5d', 1.2); }
    [1, -1].forEach(k => { s += line([A[0] - nx * k, A[1] - ny * k - 9], [B[0] - nx * k, B[1] - ny * k - 9], '#7a5534', 2);
      for (let t = 0; t <= 1.001; t += 0.125) { const px = x1 + dx * t - nx * k, py = y1 + Y + dy * t - ny * k; s += line([px, py], [px, py - 9], '#7a5534', 2); } });
    return s;
  }

  /* ---------- 版面：電腦一排（≤4 座）或兩排蛇行；手機兩欄蛇行 ---------- */
  function layout(n) {
    const tall = window.innerWidth < 700;
    if (tall) {
      const W = 640, rows = Math.ceil(n / 2), pos = [];
      for (let i = 0; i < n; i++) { const r = Math.floor(i / 2), k = i % 2, col = r % 2 ? 1 - k : k;
        const alone = n % 2 && i === n - 1; pos.push([alone ? 320 : col ? 475 : 165, 200 + r * 300 + (col && !alone ? 24 : 0)]); }
      return { W, H: 200 + (rows - 1) * 300 + 170, R: 96, pos };
    }
    const W = 1200, rows = n <= 4 ? 1 : 2, cols = Math.ceil(n / rows), cell = W / cols, pos = [];
    for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), k = i % cols, col = r % 2 ? cols - 1 - k : k;
      pos.push([cell * (col + 0.5), 205 + r * 330 + (col % 2 ? 34 : -6)]); }
    return { W, H: 205 + (rows - 1) * 330 + 170, R: Math.min(92, cell * 0.31), pos };
  }

    name: { chinese: '國文島', idioms: '成語島', english: '英文島', math: '數學島', science: '理化島', civics: '公民島', history: '歷史島', geography: '地理島' }
  };
  function regionSVG(items, sel, Lo, ox, oy) {

      s += `<g class="pm-isl${sel === i ? ' sel' : ''}" data-i="${i}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(it.name + '：' + it.sub)}">
        <g class="pm-bob" style="animation-delay:-${(i * 0.7).toFixed(1)}s"><g class="pm-lift">
          <g ${it.locked ? 'filter="url(#pmGray)" opacity=".8"' : ''}>${islandSVG(it.kind, it.color, R, anim && !it.locked)}</g>
          ${it.locked ? cloud(-36, -46, 0.8) + `<g transform="translate(30,-62)"><circle r="17" fill="#fff"/><text y="7" font-size="20" text-anchor="middle">🔒</text></g>` : ''}
          ${labelSVG(i + 1, it.name, it.sub, it.color, R * 0.5 + 62, /★/.test(it.sub) && !/★ 0 \//.test(it.sub))}

  const svgHead = (vb, extra = '') => `<svg viewBox="${vb.map(f1).join(' ')}" role="img" aria-label="島嶼地圖：點島嶼直接進入" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif" ${extra}>
      <defs><linearGradient id="pmSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd6df"/><stop offset="1" stop-color="#5cb8c9"/></linearGradient>
      <linearGradient id="pmBeam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff3bf"/><stop offset="1" stop-color="#fff3bf" stop-opacity="0"/></linearGradient>

  function waves(x0, y0, w, h, seed, dens = 9000) {

  function crumbTick() {

  /* ===================================================================

  function headTick() {

      const heroes = resolve(cfg.hero); const hero = heroes[0];
      let el = document.querySelector(`.pm-head[data-ph="${cfg.key || 'head'}"]`);

      if (!document.getElementById('pe115-head-css')) { const st = document.createElement('style'); st.id = 'pe115-head-css'; st.textContent = headCSS; document.head.appendChild(st); }
      heroes.forEach(h => { if (h.style.display !== 'none') h.style.display = 'none'; });
      const lvEl = cfg.level ? cfg.level() : (hero.querySelector ? hero.querySelector('.pe-level') : null) || document.querySelector('.pe-level');
      const lv = ((lvEl && lvEl.textContent) || '').replace(/（[^）]*）/g, '').replace(/\(.*?\)/g, '').trim();
      const range = (cfg.range ? cfg.range() : '') || '', chips = (cfg.chips ? cfg.chips() : []).filter(Boolean).map(t => t.replace(/\s*\/\s*/g, ' / ').replace(/(\d)([A-Za-z])/g, '$1 $2').replace(/([\u4e00-\u9fff])(\d)/g, '$1 $2'));
      const c = toHex(typeof cfg.color === 'function' ? cfg.color() : cfg.color || '#3b5bdb'), kind = typeof cfg.kind === 'function' ? cfg.kind() : cfg.kind;
      const name = typeof cfg.name === 'function' ? cfg.name() : cfg.name, sub = typeof cfg.sub === 'function' ? cfg.sub() : (cfg.sub || '');

    });
  }
  /* 第幾次段考：看檔名 xxx115010N.html 的 N（複製改名後各科設定自動跟著變，不用手改） */

PE115Map.scene({

/* 課次頁：小單元 → 街區建築（注音＝鐘鼓樓、注釋＝書院、課文選擇＝學堂、特色單元＝該課地標、句型＝工坊、改錯＝偵探所、閱讀＝報社、模擬段考＝獎盃台） */

});

});

PE115Map.head({ hero: '#app > .hero', name: '國文島', sub: PE115Map.examName || '第二次段考', kind: 'pavilion', color: '#c2255c',

  chips: () => [...document.querySelectorAll('#app > .hero .stat')].map(x => x.textContent.replace(/\s+/g, ' ').trim()) });
