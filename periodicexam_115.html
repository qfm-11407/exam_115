<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一一五上學期段考強化練習</title>
<!--
  ===== 維護說明（給老師） =====
  1. 所有練習網站都登記在下方 <script> 的 PAGES 清單。
  2. 新增一個練習：複製一筆，改 subject / exam / file / title / range / tags。
  3. status：'ready' = 開放（可點進去）、'building' = 建置中、'soon' = 即將推出。
  4. 新增科目：在 SUBJECTS 加一筆（順序即畫面上的科目順序）
     社會分成公民／歷史／地理三張卡片，共用同一個 social 頁：SUBJECTS 的 part 會讓連結帶上 #civics 等，
     直接開啟該科；練習等級讀社會頁寫入的 subjects[part]。三科代表色為同一橘色系（深→淺）。，再到 CSS 的 :root 加一個顏色變數。
  5. 練習等級自動讀取 localStorage「pe115:levels」（各練習頁共用元件 PE115 寫入），不用手動標記。
  5-1. 唯一存放位置：literacy_exam/八年級段考（本頁與所有練習 HTML 放在同一層，整個資料夾上傳 GitHub）。
       連結 = SUBJECTS 的 dir（一律為 ''）＋ PAGES 的 file。
     資料夾結構改變時，只要改 dir。
  6. 卡片 title 寫該科特色名稱（例：數學闖關基地），不重複寫段考次數；練習頁本身的標題統一為
     「八年級XX 第N次段考強化練習」，規格見專案文件「網站規格/段考強化練習_頁面標題與說明規格.md」。
  7. 操作流程：首頁選段考 → 顯示該次段考的各科練習（網址會變成 #exam1、#exam2…，可直接分享）。
-->
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1f2433; --muted:#667085; --line:#e3e6ee;
  --accent:#3b5bdb; --accent-soft:#edf1ff;
  --chi:#c2255c; --idm:#0b7285; --eng:#7048e8; --math:#1971c2; --sci:#2b8a3e; --civ:#8a2f08; --his:#c2410c; --geo:#e8590c;
  --ready-bg:#e6f6ec; --ready-ink:#1b7a43;
  --build-bg:#fff3dc; --build-ink:#9a5800;
  --soon-bg:#eef0f4; --soon-ink:#6b7280;
  --shadow:0 2px 10px rgba(20,30,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141821; --card:#1d2230; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2c3344;
    --accent:#748ffc; --accent-soft:#252c44;
    --chi:#f06595; --idm:#3bc9db; --eng:#9775fa; --math:#4dabf7; --sci:#51cf66; --civ:#e8590c; --his:#fd7e14; --geo:#ffa94d;
    --ready-bg:#16352a; --ready-ink:#69db7c;
    --build-bg:#3a2d12; --build-ink:#ffc078;
    --soon-bg:#262c3a; --soon-ink:#9aa3b5;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141821; --card:#1d2230; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2c3344;
  --accent:#748ffc; --accent-soft:#252c44;
  --chi:#f06595; --idm:#3bc9db; --eng:#9775fa; --math:#4dabf7; --sci:#51cf66; --civ:#e8590c; --his:#fd7e14; --geo:#ffa94d;
  --ready-bg:#16352a; --ready-ink:#69db7c;
  --build-bg:#3a2d12; --build-ink:#ffc078;
  --soon-bg:#262c3a; --soon-ink:#9aa3b5;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  font-size:17px; line-height:1.6;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- 頁首 ---------- */
header{padding:32px 0 12px; text-align:center}
.kicker{font-size:.9rem; color:var(--muted); letter-spacing:.08em}
h1{margin:4px 0 6px; font-size:clamp(1.6rem,4.2vw,2.5rem); line-height:1.25}
.sub{color:var(--muted); margin:0}

/* ---------- 首頁：選段考 ---------- */
.exam-list{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:24px 0}
.exam-btn{
  text-align:left; cursor:pointer; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:22px 20px 18px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:10px;
  transition:transform .15s, border-color .15s;
}
.exam-btn:hover{transform:translateY(-3px); border-color:var(--accent)}
.exam-btn[disabled]{cursor:default; opacity:.6}
.exam-btn[disabled]:hover{transform:none; border-color:var(--line)}
.stage{
  align-self:flex-start; font-size:.8rem; font-weight:700; letter-spacing:.1em; color:var(--accent);
  background:var(--accent-soft); padding:3px 10px; border-radius:6px;
}
.exam-btn h2{margin:0; font-size:1.6rem}
.exam-meta{color:var(--muted); font-size:.95rem; margin:0}
/* 科目小標籤固定兩排、每排四科：國文 成語 英文 數學／理化 公民 歷史 地理 */
.dots{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.dots span{font-size:.8rem; padding:2px 4px; border-radius:6px; border:1px solid var(--line); color:var(--muted); text-align:center; white-space:nowrap}
.dots span.on{border-color:transparent; background:var(--c); color:#fff}
.enter{margin-top:auto; font-weight:700; color:var(--accent)}

.prog-label{font-size:.85rem; color:var(--muted); display:flex; justify-content:space-between}
.bar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}

/* ---------- 段考頁：各科 ---------- */
.exam-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; margin:12px 0 18px}
.back{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:8px 16px; border-radius:10px; cursor:pointer; font-weight:600;
}
.back:hover{border-color:var(--accent)}
.exam-title{display:flex; align-items:center; gap:12px; margin-right:auto}
.exam-title h2{margin:0; font-size:1.6rem}
.exam-prog{flex:0 1 260px; min-width:200px}

.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.card{
  background:var(--card); border:1px solid var(--line); border-top:6px solid var(--c);
  border-radius:16px; padding:18px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:8px;
}
.card.off{opacity:.65}
.card-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.subj{font-weight:700; font-size:1.15rem; color:var(--c); display:flex; align-items:center; gap:8px}
.pill{font-size:.78rem; font-weight:700; padding:2px 10px; border-radius:99px; white-space:nowrap}
.pill.ready{background:var(--ready-bg); color:var(--ready-ink)}
.pill.building{background:var(--build-bg); color:var(--build-ink)}
.pill.soon{background:var(--soon-bg); color:var(--soon-ink)}
.card h3{margin:0; font-size:1.2rem; line-height:1.4}
.range{margin:0; color:var(--muted)}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tags span{font-size:.8rem; border:1px solid var(--line); padding:1px 8px; border-radius:6px; color:var(--muted)}
.card-foot{margin-top:auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding-top:8px}
.card-foot .go{white-space:nowrap}
.go{
  text-decoration:none; font-weight:700; color:#fff; background:var(--c);
  padding:9px 18px; border-radius:10px; display:inline-block;
}
.go:hover{filter:brightness(1.08)}
.nogo{font-size:.9rem; color:var(--muted)}
.lv{font-size:.95rem;font-weight:700;color:var(--ink);white-space:nowrap}
.lv .st{color:#f59f00;letter-spacing:1px;font-size:1.05rem}
.lv.none{color:var(--muted);font-weight:500}
.lv-note{font-size:.8rem;color:var(--muted);margin:0}
.done{
  border:1px solid var(--line); background:transparent; color:var(--muted); font-size:.85rem;
  padding:6px 10px; border-radius:9px; cursor:pointer; white-space:nowrap;
}
.done[aria-pressed="true"]{background:var(--ready-bg); color:var(--ready-ink); border-color:transparent; font-weight:700}

footer{margin:40px 0 30px; color:var(--muted); font-size:.85rem; text-align:center}

@media (max-width:1020px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .exam-list{grid-template-columns:1fr}
  .exam-btn{flex-direction:column}
}
@media (max-width:560px){
  body{font-size:16px}
  .grid{grid-template-columns:1fr}
  .exam-prog{flex-basis:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">八年級・一一五學年度上學期</div>
    <h1>一一五上學期段考強化練習</h1>
    <p class="sub" id="sub">選擇要準備的段考，開始闖關！</p>
  </header>

  <main id="main"></main>

  <footer>練習等級：段考衝刺答對 60% ★、70% ★★、80% ★★★、90% ★★★★、全對 ★★★★★｜紀錄只存在這台裝置的瀏覽器</footer>
</div>

<script>
/* ===== 段考 ===== */
const EXAMS = [
  { n: 1, name: '第一次段考', stage: 'STAGE 1' },
  { n: 2, name: '第二次段考', stage: 'STAGE 2' },
  { n: 3, name: '第三次段考', stage: 'STAGE 3' }
];

/* ===== 科目（顏色對應 CSS 變數） =====
   dir：該科練習 HTML 所在的子資料夾（相對於本頁）。所有網頁都放在「八年級段考」同一層，所以一律是 '' */
const SUBJECTS = [
  { id: 'chinese', name: '國文',       short: '國文', icon: '📖', color: 'var(--chi)',  dir: '' },
  { id: 'idioms',  name: '成語',       short: '成語', icon: '🀄', color: 'var(--idm)',  dir: '' },
  { id: 'english', name: '英文',       short: '英文', icon: '🔤', color: 'var(--eng)',  dir: '' },
  { id: 'math',    name: '數學',       short: '數學', icon: '🔢', color: 'var(--math)', dir: '' },
  { id: 'science', name: '理化',       short: '理化', icon: '🧪', color: 'var(--sci)',  dir: '' },
  { id: 'civics',    name: '公民', short: '公民', icon: '⚖️', color: 'var(--civ)', dir: '', part: 'civics' },
  { id: 'history',   name: '歷史', short: '歷史', icon: '📜', color: 'var(--his)', dir: '', part: 'history' },
  { id: 'geography', name: '地理', short: '地理', icon: '🌏', color: 'var(--geo)', dir: '', part: 'geography' }
];

/* ===== 練習網站清單：新增練習就在這裡加一筆 =====
   status：'ready' 開放｜'building' 建置中｜'soon' 即將推出 */
const PAGES = [
  // ---------- 第一次段考 ----------
  { exam: 1, subject: 'chinese', file: 'chinese1150101.html', status: 'soon',
    title: '課文闖關', range: '第一次段考範圍', tags: [] },
  { exam: 1, subject: 'idioms', file: 'idioms1150101.html', status: 'ready',
    title: '成語闖關之旅', range: '第 13～14 回試卷・成語典 P.178–209', tags: ['成語', '闖關'] },
  { exam: 1, subject: 'english', file: 'english1150101.html', status: 'soon',
    title: '課文闖關', range: '第一次段考範圍', tags: [] },
  { exam: 1, subject: 'math', file: 'math1150101.html', status: 'soon',
    title: '數學闖關基地', range: '第一次段考範圍', tags: [] },
  { exam: 1, subject: 'science', file: 'science1150101.html', status: 'ready',
    title: '習作練習', range: '第1章 基本測量・第2章 物質的世界', tags: ['習作', '圖表重繪'] },
  { exam: 1, subject: 'civics', file: 'social1150101.html', status: 'ready',
    title: '互動式測驗系統', range: '第 1～2 課', tags: ['國家與民主政治', '民主國家中的公共意見'] },
  { exam: 1, subject: 'history', file: 'social1150101.html', status: 'ready',
    title: '互動式測驗系統', range: '第 1～2 課', tags: ['商周至隋唐的國家與社會', '商周至隋唐的民族與文化'] },
  { exam: 1, subject: 'geography', file: 'social1150101.html', status: 'ready',
    title: '互動式測驗系統', range: '第 1～2 課', tags: ['中國的自然環境', '中國的人口成長與文化遷移'] },

  // ---------- 第二次段考 ----------
  { exam: 2, subject: 'chinese', file: 'chinese1150102.html', status: 'ready',
    title: '課文闖關', range: '第四～六課・語文常識二',
    tags: ['注音', '注釋', '句型', '改錯', '閱讀'] },
  { exam: 2, subject: 'idioms', file: 'idioms1150102.html', status: 'building',
    title: '成語闖關之旅', range: '第二次段考成語', tags: ['成語', '闖關'] },
  { exam: 2, subject: 'english', file: 'english1150102.html', status: 'ready',
    title: '課文闖關', range: 'Lesson 3・Lesson 4・Review 2',
    tags: ['字彙', '文法', '翻譯', '改寫', '閱讀'] },
  { exam: 2, subject: 'math', file: 'math1150102.html', status: 'ready',
    title: '數學闖關基地', range: '2-2 根式的運算 ～ 3-2 利用十字交乘法因式分解（2-1 為暖身複習）',
    tags: ['課本例題', '習作', '速測', '章末總習題', '魔王關'] },
  { exam: 2, subject: 'science', file: 'science1150102.html', status: 'ready',
    title: '習作練習', range: '第3章 波動與聲音・第4章 光',
    tags: ['習作', '第三章練習', '第四章練習', '段考模擬', '逐題檢討'] },
  { exam: 2, subject: 'civics', file: 'social1150102.html', status: 'ready',
    title: '互動式測驗系統', range: '第 3～4 課＋模擬卷', tags: ['政府與權力分立', '我國的中央政府', '模擬卷'] },
  { exam: 2, subject: 'history', file: 'social1150102.html', status: 'ready',
    title: '互動式測驗系統', range: '第 3～4 課＋模擬卷', tags: ['宋元時期的民族互動', '明清帝國與天朝體制', '模擬卷'] },
  { exam: 2, subject: 'geography', file: 'social1150102.html', status: 'ready',
    title: '互動式測驗系統', range: '第 3～4 課＋模擬卷', tags: ['中國的產業發展與地區差異', '中國的經濟發展與全球關連', '模擬卷'] },

  // ---------- 第三次段考 ----------
  { exam: 3, subject: 'chinese', file: 'chinese1150103.html', status: 'soon',
    title: '課文闖關', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'idioms', file: 'idioms1150103.html', status: 'soon',
    title: '成語闖關之旅', range: '第三次段考成語', tags: [] },
  { exam: 3, subject: 'english', file: 'english1150103.html', status: 'soon',
    title: '課文闖關', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'math', file: 'math1150103.html', status: 'soon',
    title: '數學闖關基地', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'science', file: 'science1150103.html', status: 'soon',
    title: '習作練習', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'civics', file: 'social1150103.html', status: 'soon',
    title: '互動式測驗系統', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'history', file: 'social1150103.html', status: 'soon',
    title: '互動式測驗系統', range: '第三次段考範圍', tags: [] },
  { exam: 3, subject: 'geography', file: 'social1150103.html', status: 'soon',
    title: '互動式測驗系統', range: '第三次段考範圍', tags: [] }
];

const STATUS_TEXT = { ready: '開放練習', building: '建置中', soon: '即將推出' };

/* ===== 練習等級：各練習頁把段考衝刺成績寫進 pe115:levels，這裡讀出來顯示 =====
   60% ★、70% ★★、80% ★★★、90% ★★★★、全對 ★★★★★（只取最佳成績，不會下降） */
const LV_KEY = 'pe115:levels';
function levels() { try { return JSON.parse(localStorage.getItem(LV_KEY)) || {}; } catch (e) { return {}; } }
const starsOf = p => p >= 99.95 ? 5 : p >= 90 ? 4 : p >= 80 ? 3 : p >= 70 ? 2 : p >= 60 ? 1 : 0;
const starStr = n => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
function levelOf(file, part) {
  let r = levels()[file];
  if (r && part) r = (r.subjects || {})[part];   // 社會頁：各科各自評級
  return r ? { stars: starsOf(r.best || 0), best: r.best || 0, tries: r.tries || 0 } : null;
}

const subj = id => SUBJECTS.find(s => s.id === id);
const subjOrder = id => SUBJECTS.findIndex(s => s.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pagesOf = n => PAGES.filter(p => p.exam === n).sort((a, b) => subjOrder(a.subject) - subjOrder(b.subject));

function progress(list) {
  const open = list.filter(p => p.status === 'ready');
  const d = open.filter(p => (levelOf(p.file, subj(p.subject).part) || {}).stars > 0).length;
  const pct = open.length ? Math.round(d / open.length * 100) : 0;
  return `<div class="prog-label"><span>練習等級</span><span>已評級 ${d} / ${open.length} 科</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

/* ---------- 首頁：三次段考 ---------- */
function renderHome() {
  document.getElementById('sub').textContent = '選擇要準備的段考，開始闖關！';
  const html = EXAMS.map(e => {
    const list = pagesOf(e.n);
    const open = list.filter(p => p.status === 'ready').length;
    const dots = list.map(p => {
      const s = subj(p.subject);
      return `<span class="${p.status === 'ready' ? 'on' : ''}" style="--c:${s.color}">${esc(s.short)}</span>`;
    }).join('');
    return `<button type="button" class="exam-btn" data-exam="${e.n}" ${open ? '' : 'disabled'}>
      <span class="stage">${e.stage}</span>
      <h2>${e.name}</h2>
      <p class="exam-meta">${open ? `${open} 科開放練習` : '尚未開放'}</p>
      <div class="dots">${dots}</div>
      ${open ? `<div>${progress(list)}</div><span class="enter">進入 →</span>` : ''}
    </button>`;
  }).join('');
  document.getElementById('main').innerHTML = `<div class="exam-list">${html}</div>`;
}

/* ---------- 段考頁：各科練習 ---------- */
function card(p) {
  const s = subj(p.subject);
  const ready = p.status === 'ready';
  const lv = levelOf(p.file, s.part);
  const lvHTML = lv && lv.stars
    ? `<span class="lv" title="段考衝刺最佳 ${lv.best}%">練習等級 <span class="st">${starStr(lv.stars)}</span></span>`
    : `<span class="lv none">${lv ? '尚未評級（最佳 ' + lv.best + '%）' : '尚未評級'}</span>`;
  const tags = (p.tags || []).map(t => `<span>${esc(t)}</span>`).join('');
  const foot = ready
    ? `<a class="go" href="${encodeURI((s.dir || '') + p.file) + (s.part ? '#' + s.part : '')}">開始練習 →</a>
       ${lvHTML}`
    : `<span class="nogo">${p.status === 'building' ? '老師製作中，敬請期待' : '段考前開放'}</span>`;
  return `<article class="card${ready ? '' : ' off'}" style="--c:${s.color}">
    <div class="card-top"><span class="subj"><span aria-hidden="true">${s.icon}</span>${esc(s.name)}</span>
      <span class="pill ${p.status}">${STATUS_TEXT[p.status]}</span></div>
    <h3>${esc(p.title)}</h3>
    <p class="range">範圍：${esc(p.range)}</p>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    <div class="card-foot">${foot}</div>
  </article>`;
}

function renderExam(n) {
  const e = EXAMS.find(x => x.n === n);
  const list = pagesOf(n);
  document.getElementById('sub').textContent = '適用：課前預習・課後複習・自主練習・段考衝刺｜完成段考衝刺就會自動評定練習等級';
  document.getElementById('main').innerHTML = `
    <div class="exam-head">
      <button type="button" class="back" data-home>← 回段考選單</button>
      <div class="exam-title"><span class="stage">${e.stage}</span><h2>${e.name}</h2></div>
      <div class="exam-prog">${progress(list)}</div>
    </div>
    <div class="grid">${list.map(card).join('')}</div>`;
}

/* ---------- 切換畫面（用網址 #exam1 記住目前段考，瀏覽器返回鍵也能用） ---------- */
function route() {
  const m = location.hash.match(/^#exam(\d)$/);
  const n = m ? Number(m[1]) : 0;
  if (n && EXAMS.some(e => e.n === n)) renderExam(n); else renderHome();
}

document.addEventListener('click', e => {
  const x = e.target.closest('.exam-btn');
  if (x && !x.disabled) { location.hash = 'exam' + x.dataset.exam; window.scrollTo(0, 0); return; }
  if (e.target.closest('[data-home]')) { location.hash = ''; window.scrollTo(0, 0); return; }
});
window.addEventListener('hashchange', route);
/* 從練習頁返回（或其他分頁更新成績）時重新讀取練習等級 */
window.addEventListener('pageshow', route);
window.addEventListener('storage', e => { if (e.key === LV_KEY) route(); });
route();
</script>
</body>
</html>
