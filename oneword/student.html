<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>平板作答｜單字擂台</title><link rel="stylesheet" href="./style.css?v=20261029-tablet-260"><script type="module" src="./app.js?v=20261029-tablet-260"></script></head><body data-page="play"><header class="topbar"><a class="brand" href="./index.html"><span class="brand-mark">字</span><span>單字擂台<small>WORD ARENA</small></span></a><span id="connection" class="connection">尚未加入</span></header><main class="play-main"><section id="join-panel" class="card join-panel"><span class="kicker">YOUR TURN TO WRITE</span><p class="muted student-layout-note">平板、手機皆可作答，支援直向與橫向。</p><h1>準備落筆。</h1><p class="muted">限本班學號加入</p><form id="join-form"><label>房號<input id="join-code" maxlength="6" placeholder="六位房號" required autocapitalize="characters" autocomplete="off"></label><div class="form-row"><label>學號<input id="join-student-id" type="text" inputmode="numeric" maxlength="7" pattern="^(?:14107(?:0[1-9]|1[0-5])|14207(?:1[6-9]|2[0-8]))$" title="限本班學號加入" placeholder="請輸入學號" autocomplete="off" required></label><label>暱稱（選填）<input id="join-name" maxlength="12" placeholder="你的名字"></label></div><button id="join-submit" class="button primary wide" type="submit">加入比賽 →</button></form><p><a id="direct-student-link" class="setup-doc-link" hidden>開啟平板模式（建議平板、手機使用） ↗</a></p><p id="join-status" class="muted" role="status" aria-live="polite"></p><p id="join-error" class="form-error" role="alert"></p></section><div id="writing-panel" hidden><div id="play-practice" class="notice amber" hidden>流程演練中・不辨識實際筆跡</div><div class="play-meta"><span id="player-identity" class="pill neutral"></span><span id="play-room" class="tiny-label"></span></div><section class="play-question"><div class="question-overline"><span id="play-round" class="kicker">等待出題</span><span id="play-countdown" class="timer-badge">—</span></div><h1 id="play-prompt">好好握筆，準備上場。</h1></section><div class="writing-card"><div class="writing-instruction"><span>請補上成語中缺少的 <b>一個字</b></span><span id="write-state">等待教師開始</span></div><div class="canvas-wrap"><canvas id="handwriting" width="512" height="512" aria-label="單字手寫作答區"></canvas><span id="canvas-hint" class="canvas-hint">在這裡寫字</span><div id="canvas-lock" class="canvas-lock" hidden><span id="lock-symbol">✓</span><strong id="lock-message">已交卷</strong><small id="lock-detail">答案已鎖定，等待統一揭曉。</small></div></div><div class="drawing-toolbar"><button id="undo" class="tool-button" type="button">↶ 復原</button><button id="eraser" class="tool-button" type="button" aria-pressed="false">▱ 橡皮擦</button><button id="clear" class="tool-button" type="button">清除</button><span class="pen-description">黑筆・單字</span></div></div><button id="submit-button" class="button primary wide submit-button" disabled>送出答案 →</button><p id="play-message" class="play-message" role="status">請在倒數結束前送出，送出後無法修改。</p><div id="own-result" class="own-result" role="status" aria-live="polite" hidden></div></div></main><div id="toast" class="toast" role="status" hidden></div></body></html>
