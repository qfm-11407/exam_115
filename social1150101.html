            const allButtons = uiElements.optionsContainer.querySelectorAll('button');

            // 鎖定所有選項
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
                btn.classList.remove('hover:border-gray-300', 'hover:shadow-md', 'group');
            });

            // 標示正確與錯誤
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                selectedBtn.classList.remove('opacity-70');
                
                const pointsPerQuestion = 100 / currentQuestions.length;
                score += pointsPerQuestion;
                correctAnswersCount++;
                updateScoreDisplay();

                const idx = incorrectQuestions.findIndex(item => item.question === q.question);
                if (idx > -1) incorrectQuestions.splice(idx, 1);
            } else {
                selectedBtn.classList.add('incorrect');
                selectedBtn.classList.remove('opacity-70');
                // 顯示正確答案
                allButtons[q.shuffledAnswer].classList.add('correct');
                allButtons[q.shuffledAnswer].classList.remove('opacity-70');

                // 檢查是否已在錯題簿中，用題目文字來比對避免深拷貝產生的參照問題
                const isAlreadyInIncorrect = incorrectQuestions.some(item => item.question === q.question);
                if (!isAlreadyInIncorrect) {
                     incorrectQuestions.push(q);
                }
            }

            // 顯示解答區塊
            if (isCorrect) {
                uiElements.expContainer.className = 'mt-6 p-6 rounded-xl shadow-sm border border-emerald-100 bg-emerald-50 text-gray-800 fade-in';
                uiElements.expTitle.className = 'font-bold mb-2 flex items-center text-lg text-emerald-700';
                uiElements.expIcon.textContent = '✅';
                uiElements.expStatusText.textContent = '答對了！解題剖析：';
            } else {
                uiElements.expContainer.className = 'mt-6 p-6 rounded-xl shadow-sm border border-rose-100 bg-rose-50 text-gray-800 fade-in';
                uiElements.expTitle.className = 'font-bold mb-2 flex items-center text-lg text-rose-700';
                uiElements.expIcon.textContent = '💡';
                uiElements.expStatusText.textContent = '再接再厲！解題剖析：';
            }

            uiElements.expText.textContent = q.explanation || "此題暫無詳細解答說明。";
            uiElements.expContainer.classList.remove('hidden');

            uiElements.nextBtn.classList.remove('hidden');
            uiElements.nextBtnText.textContent = (currentQuestionIndex === currentQuestions.length - 1) ? '查看結果' : '下一題';
        }

        function nextQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                screens.quiz.classList.remove('fade-in');
                void screens.quiz.offsetWidth; // 觸發重繪
                screens.quiz.classList.add('fade-in');
                loadQuestion();
            } else {
                showResult();
            }
        }

        function updateScoreDisplay() {
            uiElements.scoreDisplay.textContent = Math.round(score);
        }

        function showResult() {
            uiElements.progressBar.style.width = '100%';
            
            let finalScore = Math.round(score);
            if(finalScore > 100 || correctAnswersCount === currentQuestions.length) finalScore = 100;

            const subject = quizData[currentSubjectId];
            const chapter = subject.chapters[currentChapterIndex];
            
            let titleText = `${subject.name} - ${chapter.name}`;
            if (isRetryMode) titleText += " (錯題重測)";
            
            document.getElementById('result-subject').textContent = titleText;
            document.getElementById('final-score').innerHTML = `${finalScore} <span class="text-2xl text-gray-400 font-medium">分</span>`;
            document.getElementById('correct-count').textContent = correctAnswersCount;
            document.getElementById('total-count').textContent = currentQuestions.length;
            
            const resultMsg = document.getElementById('result-message');
            const resultIcon = document.getElementById('result-icon');
            
            if (finalScore >= 90) {
                resultMsg.textContent = "太厲害了！您具備極佳的學科素養，觀念非常清晰！";
                resultIcon.innerHTML = '<div class="absolute inset-0 rounded-full animate-ping opacity-20 bg-yellow-400"></div>🏆';
                resultIcon.className = "w-28 h-28 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl shadow-lg relative bg-yellow-50 text-yellow-500 border-4 border-white";
            } else if (finalScore >= 60) {
                resultMsg.textContent = "表現不錯！推論能力很好，再把細節釐清會更棒喔！";
                resultIcon.innerHTML = '👍';
                resultIcon.className = "w-28 h-28 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl shadow-lg bg-blue-50 text-blue-500 border-4 border-white";
            } else {
                resultMsg.textContent = "再接再厲！請多利用錯題重測，仔細閱讀題目線索。";
                resultIcon.innerHTML = '💪';
                resultIcon.className = "w-28 h-28 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl shadow-lg bg-gray-100 text-gray-500 border-4 border-white";
            }

            const retryBtn = document.getElementById('retry-incorrect-btn');
            if (incorrectQuestions.length > 0) {
                retryBtn.classList.remove('hidden');
                document.getElementById('incorrect-badge').textContent = incorrectQuestions.length;
            } else {
                retryBtn.classList.add('hidden');
            }

            switchScreen('result');
        }
    </script>
</body>
</html>
